# Consumed by .github/workflows/summary-labeler.yml via fuxingloh/multi-labeler,
# which compiles each `body` value with `new RegExp(value)` -- JAVASCRIPT, no
# flags, and no try/catch around it.
#
# SO DO NOT USE INLINE FLAG GROUPS HERE. `(?i:Content)` and `(?i)Content` are
# valid Python and throw `Invalid group` in JS, and because the compile is
# unguarded that failure takes down the WHOLE action, not just the rule holding
# it. This is a live hazard rather than a hypothetical: tools/generate_changelog.py
# parses the very same `#### Summary` line and uses `(?i:...)` throughout, so the
# idiom is one copy-paste away. Use a character class -- `[Cc]ontent` -- if a
# pattern ever needs to be case-tolerant.
#
# Note the two consumers of that line already differ on case: the changelog
# upper-cases the category before validating it, so `content "..."` is accepted
# there while matching nothing here (CDDA_CI_PLAN.md 2.6a).
version: v1

labels:
  - label: "<Enhancement / Feature>"
    matcher:
      body: "(\\s|^)#### Summary\\s*Features +\".+\"\\s*(\n|$)"

  # Content was the one changelog category with no label. The PR template and
  # tools/generate_changelog.py both define 11 -- Content, Features, Interface,
  # Mods, Balance, I18N, Bugfixes, Performance, Build, Infrastructure, None --
  # and this file covered 9. None is correctly absent (it means "no changelog
  # entry"); Content was simply missing, so a PR declaring it got no label at
  # all. Angle brackets follow the convention the other change-KIND labels use
  # here (<Bugfix>, <Enhancement / Feature>), as distinct from the area labels
  # in .github/labeler.yml.
  - label: "<Content>"
    matcher:
      body: "(\\s|^)#### Summary\\s*Content +\".+\"\\s*(\n|$)"

  - label: "Info / User Interface"
    matcher:
      body: "(\\s|^)#### Summary\\s*Interface +\".+\"\\s*(\n|$)"

  - label: "Mods"
    matcher:
      body: "(\\s|^)#### Summary\\s*Mods +\".+\"\\s*(\n|$)"

  - label: "Game: Balance"
    matcher:
      body: "(\\s|^)#### Summary\\s*Balance +\".+\"\\s*(\n|$)"

  - label: "<Bugfix>"
    matcher:
      body: "(\\s|^)#### Summary\\s*Bugfixes +\".+\"\\s*(\n|$)"

  # Digit range widened from [1-9][0-9]{3,8} to [1-9][0-9]*. Upstream's version
  # required FOUR to nine digits, which fits CleverRaven's five-digit issue
  # numbers and cannot fire on a fresh repository at all -- "Fixes #5" did not
  # match, and neither did anything below #1000. It failed silently, looking
  # exactly like a PR that referenced no issue. Now any issue from #1 upward
  # matches, while #0 and bare text still do not.
  - label: "<Bugfix>"
    matcher:
      body: ".*((C|c)lose(s|d)?|(F|f)ix(es|ed)?|(R|r)esolve(s|d)?):?.*#([1-9][0-9]*).*"

  - label: "Code: Performance"
    matcher:
      body: "(\\s|^)#### Summary\\s*Performance +\".+\"\\s*(\n|$)"

  - label: "Code: Infrastructure / Style / Static Analysis"
    matcher:
      body: "(\\s|^)#### Summary\\s*Infrastructure +\".+\"\\s*(\n|$)"

  - label: "Code: Build"
    matcher:
      body: "(\\s|^)#### Summary\\s*Build +\".+\"\\s*(\n|$)"

  - label: "Translation"
    matcher:
      body: "(\\s|^)#### Summary\\s*I18N +\".+\"\\s*(\n|$)"
