# Read by summary-labeler.yml via multi-labeler, which compiles each `body` with
# `new RegExp(value)` -- JAVASCRIPT, no flags, no try/catch.
#
# NO INLINE FLAG GROUPS. `(?i:Content)` and `(?i)Content` are valid Python and
# throw `Invalid group` in JS, and the unguarded compile takes down the WHOLE
# action, not just the rule holding it. Live hazard, not hypothetical:
# tools/generate_changelog.py parses the same `#### Summary` line and uses
# `(?i:...)` throughout, so the idiom is one copy-paste away. Use a character
# class -- `[Cc]ontent` -- for case tolerance.
#
# The two consumers already differ on case: the changelog upper-cases the
# category before validating, so `content "..."` is accepted there and matches
# nothing here (2.6a).
version: v1

labels:
  - label: "<Enhancement / Feature>"
    matcher:
      body: "(\\s|^)#### Summary\\s*Features +\".+\"\\s*(\n|$)"

  # ADDED. Content was the one changelog category with no label. The PR template
  # and generate_changelog.py both define 11 (Content, Features, Interface, Mods,
  # Balance, I18N, Bugfixes, Performance, Build, Infrastructure, None) and this
  # file covered 9. None is correctly absent -- it means "no changelog entry" --
  # but Content was simply missing, so a PR declaring it got no label at all.
  # Angle brackets match the other change-KIND labels here, as distinct from the
  # area labels in .github/labeler.yml.
  - label: "<Content>"
    matcher:
      body: "(\\s|^)#### Summary\\s*Content +\".+\"\\s*(\n|$)"

  - label: "Info / User Interface"
    matcher:
      body: "(\\s|^)#### Summary\\s*Interface +\".+\"\\s*(\n|$)"

  - label: "Mods"
    matcher:
      body: "(\\s|^)#### Summary\\s*Mods +\".+\"\\s*(\n|$)"

  - label: "Game: Balance"
    matcher:
      body: "(\\s|^)#### Summary\\s*Balance +\".+\"\\s*(\n|$)"

  - label: "<Bugfix>"
    matcher:
      body: "(\\s|^)#### Summary\\s*Bugfixes +\".+\"\\s*(\n|$)"

  # Digit range widened, [1-9][0-9]{3,8} -> [1-9][0-9]*. Upstream required FOUR
  # to nine digits, fitting CleverRaven's five-digit issue numbers but unable to
  # fire on a fresh repo at all: "Fixes #5" did not match, nor anything below
  # #1000. It failed SILENTLY, looking exactly like a PR referencing no issue.
  # Now #1 upward matches; #0 and bare text still do not.
  - label: "<Bugfix>"
    matcher:
      body: ".*((C|c)lose(s|d)?|(F|f)ix(es|ed)?|(R|r)esolve(s|d)?):?.*#([1-9][0-9]*).*"

  - label: "Code: Performance"
    matcher:
      body: "(\\s|^)#### Summary\\s*Performance +\".+\"\\s*(\n|$)"

  - label: "Code: Infrastructure / Style / Static Analysis"
    matcher:
      body: "(\\s|^)#### Summary\\s*Infrastructure +\".+\"\\s*(\n|$)"

  - label: "Code: Build"
    matcher:
      body: "(\\s|^)#### Summary\\s*Build +\".+\"\\s*(\n|$)"

  - label: "Translation"
    matcher:
      body: "(\\s|^)#### Summary\\s*I18N +\".+\"\\s*(\n|$)"
