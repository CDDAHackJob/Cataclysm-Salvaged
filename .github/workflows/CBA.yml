name: Clang Build Analyzer

# HackJob's Summary:
# Workflow rebuilt and tested extensively with Claude Opus.
# Its comments are condensed into "caveman" claude and may be a bit confusing.
# Some sections will be referring to items within a plan document not in the repo.
# These are notes for myself and Claude.
# To summarize the rewrite, we moved to clang 21 and minimized relying on external sources.
# ~HackJob
#
# Profiles BUILD TIME, not game performance: ranks slowest translation units,
# heaviest headers, costliest template instantiations. Pairs with iwyu. Profiles
# the clang/Linux build, not the MSVC one you wait on (CDDA_CI_PLAN.md 2.4).
#
# DISPATCH ONLY. Upstream ran it on every push to master: a full -ftime-trace
# build of game AND test suite (Makefile defaults TESTS=1), ~5 min, 774 MB of
# traces, for a report nobody reads unless hunting compile time. Tool, not gate
# (1.8). No paths: filter -- a paths: block is ACCEPTED under workflow_dispatch
# but has nothing to filter, so it would look like a filter and be inert.
on:
  workflow_dispatch:

# Static group -- upstream mixed github.event_name in so a push and a dispatch
# could coexist, and the push trigger is gone. Cancel: the second answer is the
# wanted one, and each run holds a CPU-bound build for minutes.
concurrency:
  group: clang-build-analyzer
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: cdda-ci

    # Measured under the limits this job actually runs with: --cpuset-cpus=0-11
    # --memory=16g, 6 P-cores / 12 threads of an i7-12700K, the rest left for
    # ZFS, Samba and the panel. 377 s, peak 7.46 GB (47% of the cap). Cut from
    # 0-15 for heat, not speed: 316 s and 8.62 GB there, but cores at TjMax.
    #
    # 30 minutes is headroom for a cold link and a busy box, not an estimate of
    # the work. Do not tighten it toward the measurement -- a full compile varies
    # far more than the second-scale checks.
    timeout-minutes: 30

    steps:
    # persist-credentials: false -- nothing here pushes, and the default leaves a
    # token in the workspace .git/config for the life of the job.
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    # NO apt-get STEP AT ALL. Upstream installed `libncursesw5-dev gettext` with
    # no `apt-get update` -- fails outright on this image's empty cache, but the
    # fix was never to add the update. Everything is baked into cdda-ci (11.4),
    # the standing rule for Forgejo-side workflows: ncurses and gettext for the
    # game build, clang-21 because -ftime-trace is a clang feature g++ lacks, and
    # zlib1g-dev because src/cata_utility.cpp includes <zconf.h> -- absent here
    # where ubuntu-latest preinstalls it, so the build once died 53 files in at
    # obj/cata_utility.o looking like a source fault.
    #
    # clang MOVED FROM UNVERSIONED (bookworm's 14.0.6) 2026-08-22: 14 was
    # inherited from the clang++-14 upstream happened to name, not chosen, and
    # profiling four majors behind what the matrix builds with measures a build
    # nobody ships. SAFE because this emits a PROFILE, not a verdict -- a newer
    # clang makes a timing DIFFERENT, not wrong. clang-tidy is NOT moved with it:
    # it gates, and 21 surfaces 746 new findings (CDDA_TOOLCHAIN_PLAN.md step 5,
    # open). CONSEQUENCE: profiles compare only against the same compiler;
    # anything measured before that date was taken under clang 14.
    #
    # Not version-ASSERTED, unlike astyle and flake8 -- assert what decides a
    # verdict. Still PRINTED below: with the install step gone the compiler
    # appears nowhere else in the log, and a saved profile must be attributable.
    - name: verify toolchain
      run: |
        set -eu

        # VERIFY THE COMPILER THIS JOB ACTUALLY USES. This checked unversioned
        # `clang++` until 2026-08-22 and kept passing after the build moved to
        # clang++-21 -- proving clang 14 present while a different compiler did
        # the work. A guard that outlives what it guards reports green for a
        # condition nobody depends on. Not `--version | head -1` alone: under
        # `set -e` without pipefail a pipeline reports the LAST command's status,
        # so head succeeding masks an absent compiler.
        command -v clang++-21 >/dev/null || {
          echo "clang++-21 missing -- expected it baked into the runner image" >&2
          exit 1
        }
        clang++-21 --version | head -1

        # Attributes a saved profile to an exact toolchain: the image records
        # everything it bakes, with versions, generated at build time.
        cat /etc/cdda-ci-versions

    # PINNED, where upstream cloned a moving branch. This clones third-party code
    # and then EXECUTES it against the repository -- the same trust decision as a
    # `uses:` ref, but a `git clone` in a run block, so the plan's pin-every-
    # third-party-ref rule (fix 2) never reached it. --recursive dropped with it:
    # the pinned tag builds clean without submodules, verified. Installed to
    # /usr/local/bin, not $GITHUB_PATH, so later steps do not depend on whether
    # Forgejo implements that file.
    - name: build Clang Build Analyzer
      run: |
        set -eu
        git clone --depth 1 --branch v1.6.0 \
            https://github.com/aras-p/ClangBuildAnalyzer.git "$RUNNER_TEMP/cba"

        # A TAG IS NOT A PIN -- upstream can move v1.6.0, which is why the plan's
        # rule for `uses:` refs is a full SHA. git cannot --branch a bare SHA on
        # a shallow clone, so the tag fetches and the commit is asserted after.
        got=$( git -C "$RUNNER_TEMP/cba" rev-parse HEAD )
        want=bae0cb488cce944bfc3da9850a69ad621701ebef # v1.6.0
        [ "$got" = "$want" ] || {
          echo "ClangBuildAnalyzer v1.6.0 should be $want but is $got." >&2
          echo "The tag has moved; re-verify upstream before trusting this build." >&2
          exit 1
        }

        cmake -S "$RUNNER_TEMP/cba" -B "$RUNNER_TEMP/cba/build" -DCMAKE_BUILD_TYPE=RELEASE
        cmake --build "$RUNNER_TEMP/cba/build" -- -j"$(nproc)"
        install -m 0755 "$RUNNER_TEMP/cba/build/ClangBuildAnalyzer" /usr/local/bin/

        # The SHA check proves WHAT WAS CLONED; this proves what was BUILT. A
        # correct checkout can still produce a binary that does not run, and
        # cmake failing mid-build would leave an older one on PATH. Asserted, not
        # `--version || true`, which reports a broken binary as a success.
        ver=$( ClangBuildAnalyzer --version )
        case "$ver" in
          *1.6.0*) echo "$ver" ;;
          *) echo "expected ClangBuildAnalyzer 1.6.0, got: $ver" >&2; exit 1 ;;
        esac

    # Turns compiler diagnostics into inline annotations. Presentational only --
    # cannot change pass or fail; whether Forgejo honours ::add-matcher:: is
    # unverified (as in flake8.yml). Kept: clang-tidy, iwyu and matrix use it too.
    #
    # THE ABSOLUTE URL IS LOAD-BEARING. An unqualified `uses:` resolves against
    # code.forgejo.org, which does not host this action, so written bare the job
    # dies before any build with
    #   fatal: repository 'https://code.forgejo.org/ammaraskar/gcc-problem-matcher/' not found
    # Measured. checkout above works bare only because it IS mirrored there;
    # even actions/labeler is not. Absolute pins source as well as commit
    # (11.3, 11.5e).
    - uses: https://github.com/ammaraskar/gcc-problem-matcher@cb2e3f949c41b7818628f35f8484a9b0acf90cf9 # master @ 2026-08-15

    # CXXFLAGS=-ftime-trace does NOT clobber the Makefile's own flags, despite
    # looking like it should -- MEASURED: the compile line goes from 41 tokens to
    # 42, gaining -ftime-trace and losing nothing. -std=c++17, -Og and the whole
    # -W set survive, so this profiles the real build configuration.
    #
    # CCACHE IS DELIBERATELY NOT SET. A cache hit skips compilation, and a
    # skipped compilation emits no -ftime-trace JSON; the Makefile wires ccache
    # in only on an explicit CCACHE=1, so this is safe today. Copying CCACHE=1
    # from matrix.yml would leave this job green, fast, and measuring nothing.
    #
    # -j$(nproc) IS CORRECT ONLY BECAUSE THE RUNNER USES --cpuset-cpus: it
    # changes affinity, so nproc reports 12. --cpus= would NOT -- it caps
    # bandwidth without touching affinity, nproc keeps reporting the host's 20
    # (measured), and this line would quietly oversubscribe. If
    # container.options moves off cpuset, this line moves with it (11.5f).
    - name: build with tracing
      run: |
        set -eu
        ClangBuildAnalyzer --start .
        # -Wno-error=deprecated-declarations IS REQUIRED AT CLANG 21 AND WAS NOT
        # AT 14. libstdc++ 12 implements std::stable_sort via its own deprecated
        # std::get_temporary_buffer, and Clang blames the INSTANTIATION POINT --
        # our stable_sort calls -- so it reads as a defect in this tree. It is
        # not: Clang 21 x libstdc++ 12 fires it, Clang 21 x libstdc++ 14 is clean
        # (CDDA_TOOLCHAIN_PLAN.md 1.2) -- what the matrix's two clang++-21 jobs
        # exist to distinguish, and the Debian sanitizer job carries the same
        # downgrade. Clang 14 never emitted it, so this job was shielded by being
        # four majors behind rather than by being correct. -Wno-error=, not
        # -Wno-: diagnostics stay visible, so a genuine deprecation in project
        # code is not hidden by the flag that tolerates the standard library's.
        CLANG=clang++-21 CXXFLAGS="-ftime-trace -Wno-error=deprecated-declarations" \
          make -j"$(nproc)"
        ClangBuildAnalyzer --stop . buildAnalysis

    # READING THE OUTPUT: HEADER COSTS ARE SPLIT AND MUST BE SUMMED.
    #
    # The Makefile defaults to TESTS=1 / RUNTESTS=0 (Makefile:212-218), so plain
    # `make` builds the test suite too -- ~190 extra translation units, kept in
    # scope because it is real time a developer waits on. Test TUs include the
    # same headers by a relative path and CBA keys on the path as written, so
    # every hot header appears TWICE:
    #
    #   267459 ms: src/character.h      (included 196 times)
    #   198277 ms: ../src/character.h   (included 128 times)
    #
    # One file. Real cost 465.7 s -- 17.8% of the entire frontend -- and the top
    # line alone understates it by 43%. Same for avatar.h and npc.h. Sum both
    # paths first; a header's rank can change once you do.
    - name: analyze
      run: ClangBuildAnalyzer --analyze buildAnalysis

    # NO ARTIFACT UPLOAD, where upstream uploaded `**/obj/*.json` -- 616 files
    # and 774 MB on a complete build. The analysis above already prints what the
    # traces are for, so uploading them would spend the storage to re-derive what
    # is in the log. Anyone wanting them can run the same three commands locally.
