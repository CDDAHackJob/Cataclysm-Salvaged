name: Detect missions that are missing .start.assign_mission_target.om_special

# HackJob's Summary:
# Workflow rebuilt and tested extensively with Claude Opus.
# Its comments are condensed into "caveman" claude and may be a bit confusing.
# Some sections will be referring to items within a plan document not in the repo.
# These are notes for myself and Claude.
# To summarize the rewrite, we pinned the version and minimized relying on external sources.
# There were also some minor bugfixes implemented with the trigger and certain missions.
# ~HackJob
#
# Upstream's filter was '**.json', which on Forgejo is not loose but EXACTLY
# INVERTED. Forgejo matches with doublestar, where '**' is recursive only as a
# whole path component and otherwise degrades to '*', so '**.json' means
# root-level *.json -- CMakePresets.json and org.cataclysmdda.CataclysmDDA.json.
# The script reads neither: it scans ./data/ only, so the filter fired on the two
# files it cannot see and never on the 5,377 it parses.
#
# 'data/**/*.json' covers all 5,377 and cannot under-match. Measured against
# bmatcuk/doublestar/v4 directly, since `forgejo-runner exec` does not evaluate
# paths: filters at all: '**' DOES match zero segments, so this also catches a
# .json directly in data/. Only data/fontdata.json is at that depth, and it is
# one of the two the script skips.
#
# The other skipped file, data/mods/replacements.json, is matched deliberately.
# A change touching only skipped files starts one 3-second job that correctly
# finds nothing -- cheaper than a negation the trigger and script must be kept
# in step with.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/assign_mission_target_needs_om_special.yml'
      - 'tools/json_tools/assign_mission_target_needs_om_special.bash'
      - 'data/**/*.json'

concurrency:
  group: assign-mission-target-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-the-tool:
    runs-on: cdda-ci

    # The check itself is 3.2s (measured on cdda-ci:6). This bound is for
    # checkout of a repository this size, and to cap a hang; it is not a
    # statement about the script's cost.
    timeout-minutes: 15

    steps:
    # persist-credentials: false because nothing here pushes. The default leaves
    # a token in the workspace .git/config for the life of the job.
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    # NO TOOL-VERSION GUARD, unlike astyle.yml, flake8.yml and cmake-format.yml:
    # jq is an engine, not a linter, so the finding comes from the repository's
    # data and no jq release re-decides it. A MISSING jq is already loud -- rc 127,
    # since every invocation fails including the last, which is what the script's
    # status is built from.
    #
    # A PER-FILE jq ERROR IS DIFFERENT, and is why this step is not the bare
    # script. Measured: jq's exit status reflects only its LAST input, so an error
    # on one file is ERASED by any later file that parses -- `jq -f prog bad.json
    # good.json` exits 0 having printed "jq: error" and skipped bad.json entirely.
    # find propagates faithfully, so the pipeline returns 0, `set -euo pipefail`
    # never fires, and the job is GREEN with the error unread in the log.
    #
    # Reachable from LEGAL content, not just corruption: om_terrain is documented
    # as "String or variable object" (doc/MISSIONS_JSON.md, get_str_or_var in
    # src/mission_util.cpp), and indexing the terrain map with an object raises
    # "Cannot index object with object". All 168 are strings today, so the first
    # PR using the variable form silently switches this check off for that file.
    #
    # Hence: capture, print, and fail on any jq diagnostic. Anchored to column 0,
    # where jq writes diagnostics, while the script's offender dump is indented.
    #
    # BOTH PREFIXES are matched because jq uses two. "jq: error (at FILE:LINE)" is
    # the swallowable runtime one; a malformed-JSON parse error ABORTS jq and so
    # fails on its own status anyway -- matched regardless, because a guard
    # catching one of two formats invites the belief that it catches both.
    #
    # And BOTH SPELLINGS of the parse error, the one part jq versions do change.
    # Measured side by side: 1.6 (the image) writes "parse error: ..." unprefixed
    # and exits 4; 1.8.1 writes "jq: parse error: ..." and exits 5. An anchored
    # "^parse error:" silently stops matching the day the base image moves past
    # bookworm. The VERDICT does not drift -- the same seeded defect gives rc 1 and
    # a byte-identical 545-byte report on both -- only the diagnostic text does,
    # which is why only the diagnostic match is written defensively.
    - name: run the tool
      run: |
        log=$( mktemp )
        status=0
        ./tools/json_tools/assign_mission_target_needs_om_special.bash > "$log" 2>&1 || status=$?
        cat "$log"
        if grep -qE '^(jq: )?(parse )?error' "$log"; then
          echo "jq reported an error on at least one file, so the check did not see the" >&2
          echo "whole tree. This does NOT fail on its own -- jq's exit status only" >&2
          echo "reflects its last input -- so it is failed here deliberately." >&2
          exit 1
        fi
        exit "$status"
