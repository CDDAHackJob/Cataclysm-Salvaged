name: astyle

# HackJob's Summary:
# Workflow rebuilt and tested extensively with Claude Opus.
# Its comments are condensed into "caveman" claude and may be a bit confusing.
# Some sections will be referring to items within a plan document not in the repo.
# These are notes for myself and Claude.
# To summarize the rewrite, we pinned the version and minimized relying on external sources.
# ~HackJob
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/astyle.yml'
      - 'Makefile'
      - '.astylerc'
      # ASTYLE_SOURCES is 1,172 files, .cpp and .h ONLY (688 and 484, nothing
      # else). '**/*.c' is therefore INERT: the tree has no .c file, and adding
      # one would not put it in ASTYLE_SOURCES, so this check would run and come
      # back green without looking at it. Kept because an inert trigger costs
      # nothing and the Makefile is filtered on too, so whatever commit adds .c
      # support triggers this job anyway. NOT evidence that C files are covered.
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.c'

concurrency:
  group: astyle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  astyle-code:
    name: astyle check

    runs-on: cdda-ci

    # ~6 s for the whole job. The default is 360 minutes, and this runner shares
    # the box with Samba and the pool, so a wedged job would hold it for six hours.
    timeout-minutes: 15

    steps:
    # persist-credentials: false because nothing here pushes. The default leaves
    # a token in the workspace .git/config for the life of the job.
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    # check version and refuse if not astyle 3.1 -- `make astyle-check` exits 0
    # when astyle is missing or too old, reporting success without checking.
    - name: verify astyle version
      run: |
        ver=$( astyle --version 2>&1 || true )
        printf '%s\n' "$ver" | grep -qE 'Version[[:space:]]+3\.1([[:space:]]|$)' || {
          echo "astyle must be version 3.1 -- see doc/CODE_STYLE.md." >&2
          echo "found: ${ver:-astyle not installed}" >&2
          exit 1
        }

    - name: astyle check
      id: astyle_check
      run: make astyle-check

    # Gated on the check itself, not on failure() alone. A bare failure() also
    # fires when the version step above fails, which would reformat the whole
    # tree with the wrong astyle and bury the one-line version error under a
    # 1,172-file diff.
    - name: Format
      if: failure() && steps.astyle_check.outcome == 'failure'
      run: make astyle-fast

    - name: Display Corrections
      if: failure() && steps.astyle_check.outcome == 'failure'
      run: git diff --color
