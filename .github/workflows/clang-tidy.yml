name: Clang-tidy 17

# HackJob's Summary:
# Workflow rebuilt and tested extensively with Claude Opus.
# Its comments are condensed into "caveman" claude and may be a bit confusing.
# Some sections will be referring to items within a plan document not in the repo.
# These are notes for myself and Claude.
# To summarize the rewrite, we pinned the version and minimized relying on external sources.
# We are also in the process of moving over to clang 21, but that introduces many new issues
# to solve that clang 17 lets pass.
# ~HackJob
#
# Static analysis, and the only workflow here shipping CDDA's OWN checks:
# tools/clang-tidy-plugin/ builds CataAnalyzerPlugin, 36 project-specific checks
# enforcing this codebase's conventions rather than generic C++ advice. Its 46
# lit tests run BEFORE its findings are trusted (measured passing on LLVM 17).
#
# A PULL-REQUEST GATE, unlike CBA.yml and iwyu.yml. Those emit a profile and an
# advisory report -- no verdict, nothing to gate on. This emits defects.
#
# AND IT KEEPS DIFF-SCOPING, which iwyu.yml dropped -- same machinery, opposite
# conclusion, because the arithmetic differs by two orders of magnitude:
#
#                          per file (avg)   whole tree, as configured
#   IWYU                   ~0.3 s           197 s    at nproc
#   clang-tidy + plugin    ~33 s CPU        ~90 min  at 4 jobs (52 s of it setup)
#
# `make includes` costs 7 s either way (614 .inc files, 25.7 MB). Against IWYU it
# buys nothing; here it is worth keeping, but only for a .cpp-only PR.
#
# SCOPING SAVES FAR LESS THAN THAT RATIO SUGGESTS. Measured 2026-08-16 on the real
# old-fork..master release diff replayed against experimental: 17 changed files
# resolved to 478 of 647 TUs -- 74% OF THE TREE -- taking 80 min against ~90
# whole-tree. An 11% saving, not a 98% one.
#
# Structural, not incidental: 6 of those 17 are HEADERS, and item.h / flag.h /
# iuse.h are included nearly everywhere. Worse, the survivors are the EXPENSIVE
# TUs -- 39.7 s CPU each against a 33.1 s average -- precisely because they pull
# in the big headers. So scoping is very effective for a .cpp-only change and
# nearly useless for a header change, and a release PR is mostly the latter.
# Size runner availability for ~90 min on any PR touching src/*.h.
#
# THE SOUND WHOLE-TREE MEASUREMENT, 2026-08-16: 537 of 647 TUs in 75 min at 4
# jobs, setup measured separately at 52 s (apt 1 s, LLVM 8 s, cmake <1 s, plugin
# build 41 s, lit 2 s). Setup is 1.2%, so 4448 s of 4500 was analysis: ~33 s CPU
# and ~8.3 s wall per TU, hence ~90 min whole-tree at 4 jobs, ~120 at upstream's 3.
#
# That 52 s CLOSES an optimisation. Nothing in setup is cached -- the plugin is
# rebuilt every run -- and caching it returns 41 s against 5400 s, under 1%. Same
# for the scripting layer: 647 wrapper spawns total 0.2 s, jq is unmeasurable.
# This job is ~98% analysis, so the only lever is analysing fewer TUs.
#
# A WHOLE-TREE TIMING IS ONLY ADMISSIBLE if the run analysed all 647 TUs and left
# no "context deadline exceeded" in the log. Several earlier figures here were
# truncated runs or small-sample extrapolations read as measurements.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    # `**/*.ext`, NOT upstream's `**.ext` -- inside a path segment `**` behaves
    # as `*`, so `**.cpp` matched only root-level files and never src/. Same fix
    # as rows 1-4 and 8-9 (fix 2).
    #
    # The last four entries are VERDICT-DEFINING SOURCES: files that change the
    # answer without changing any analysed code. A filter listing only the code
    # is the silent-pass trap one layer up -- edit the rules, and the check that
    # enforces them never re-runs to notice.
    paths:
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.hpp'
      - '**/CMakeLists.txt'
      - '**/Makefile'
      # ADDED. `.clang-tidy` IS the verdict -- it enables and disables the check
      # list, so editing it changes every future result while touching no code,
      # and it was absent. The script's escalation regex already matched it, so
      # the two halves disagreed: a change here escalated correctly whenever
      # something ELSE triggered the job, and did nothing on its own.
      - '.clang-tidy'
      # ADDED, same asymmetry. `**/CMakeLists.txt` misses `CMakeModules/**` --
      # the Find*.cmake modules deciding how SDL2, Iconv and Libintl are located,
      # inputs to the configure step this job runs. The escalation regex matched
      # them; the trigger could not fire.
      - 'CMakeModules/**'
      - 'build-scripts/clang-tidy.sh'
      - 'build-scripts/clang-tidy-wrapper.sh'
      - 'build-scripts/get_affected_files.py'
      - 'tools/clang-tidy-plugin/**'
      - '.github/workflows/clang-tidy.yml'

  # ADDED. PRs here happen only at release (experimental -> master), so without
  # this the first time 36 custom checks see a change is months after it was
  # written. A dispatched run has no changed-file list, and clang-tidy.sh handles
  # that: `files_changed` is absent, tidyable_cpp_files resolves to "unknown", and
  # it analyses everything. Dispatch means WHOLE TREE, ~90 min, by construction.
  workflow_dispatch:

# Native concurrency, replacing upstream's separate skip-duplicates job on
# fkirc/skip-duplicate-actions@master -- a mutable branch ref, one of the four
# the plan wants gone (fix 2). That job also carried `continue-on-error` plus an
# `if:` on its output, so a failure left the output empty and the check ran
# anyway. The native form has no third-party action and no failure path.
concurrency:
  group: clang-tidy-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

# `pull-requests: read` is NOT decorative: `determine changed files` calls
# `pulls.listFiles`, which GitHub scopes under pull-requests, not contents. With
# `contents: read` alone that is a 403 on a private repo, and github-script
# throws on an API error, so the gate fails on every PR. Whether Forgejo enforces
# this granularly is UNVERIFIED -- it may hand out a broader token -- but the
# declaration is correct under GitHub semantics and costs nothing if ignored.
# This is the only workflow in the set that touches the API.
permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    # Draft pull requests are skipped, as upstream did. Nothing is lost: the
    # check runs on ready_for_review, and a draft is by definition unfinished.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}

    runs-on: cdda-ci

    # NO MATRIX. Upstream split this into 'src' and 'other' subsets to fit
    # GitHub's per-job runtime limit. Here that costs real time: ONE runner, so
    # the halves queue rather than parallelise and each pays full setup again
    # (LLVM install, plugin build, cmake configure, make includes). One job is
    # strictly faster on a single-runner host. clang-tidy.sh still honours
    # CATA_CLANG_TIDY_SUBSET; unset means no subset filter.
    env:
      CMAKE: 1
      CLANG: clang++-17
      COMPILER: clang++-17
      CATA_CLANG_TIDY: plugin
      TILES: 1
      SOUND: 1
      RELEASE: 1

    # FIVE HOURS, DELIBERATELY GENEROUS. Whole-tree analysis of 647 translation
    # units is genuinely slow on this box:
    #
    #   4 jobs   537 of 647 TUs in 75 min   -> whole tree ~90 min   <= in use
    #   3 jobs   (upstream's default)       -> whole tree ~120 min
    #
    # 300 is over 3x the 4-job projection, deliberately: a ceiling that catches a
    # stuck job, not a budget to run close to. The 3-job row is upstream's default
    # and is kept only to show the ceiling holds there too -- THIS JOB RUNS AT 4,
    # the measured limit on this cooling. Do not raise it.
    #
    # A RED JOB MEANS FINDINGS *OR* TRUNCATION, and the two look alike: a timed-out
    # run leaves `context deadline exceeded` in the log while the status says only
    # "failed", exactly what a genuine finding produces. Grep for that string
    # before believing a finding count, and treat a TU count below 647 as an
    # incomplete run. Earlier, smaller timeouts truncated runs that were then read
    # as completed measurements -- what the generosity above prevents.
    #
    # forgejo-runner's own `timeout:` in config.yaml is a SEPARATE ceiling, checked
    # first, and the LOWER wins. Raised 3h -> 5h to match this; lower it and this
    # number silently stops applying, with nothing in the log naming which fired.
    # Change both together.
    #
    # The whole-tree path is reachable from an ordinary PR, not just dispatch:
    # clang-tidy.sh escalates when a change touches clang-tidy, build-scripts or
    # cmake, since the RULES changed. ~90 min with the single runner busy.
    timeout-minutes: 300

    steps:
    # LLVM 17 stays a workflow step rather than baked (11.4): version-pinned
    # toolchains are the standing exception, since baking makes every bump an
    # image rebuild. This is the LAST job on 17 -- bumping a GATE surfaces 746
    # findings (CDDA_TOOLCHAIN_PLAN.md step 5, open). iwyu.yml moved to LLVM 21 on
    # 2026-08-22 and takes it from the image, so this step is shared with nothing.
    # Everything else IS baked into cdda-ci: SDL2/FLAC/PulseAudio for TILES=1
    # SOUND=1, plus cmake, ninja, gettext, jq and lit.
    #
    # Two fixes to upstream's step, measured at 6 s total:
    #   * `apt-key add` is deprecated and gone in newer Debian -> signed-by keyring
    #   * the repo line named `jammy` (Ubuntu 22.04), absent here -> bookworm
    - name: install LLVM 17
      run: |
        set -eu
        # Fetched to a file first: under `set -e` without pipefail a
        # `wget | gpg` pipeline reports only gpg's status and would write an
        # empty keyring on a failed download, surfacing later as an opaque apt
        # signature error.
        wget -qO "$RUNNER_TEMP/llvm.key" https://apt.llvm.org/llvm-snapshot.gpg.key
        gpg --dearmor < "$RUNNER_TEMP/llvm.key" > /usr/share/keyrings/llvm.gpg
        echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] \
        http://apt.llvm.org/bookworm/ llvm-toolchain-bookworm-17 main" \
          > /etc/apt/sources.list.d/llvm.list
        apt-get update
        apt-get install -y --no-install-recommends \
          llvm-17 llvm-17-dev llvm-17-tools clang-17 clang-tidy-17 clang-tools-17 \
          libclang-17-dev

    # clang-tidy.sh and the plugin's lit suite both invoke `clang-tidy` and
    # `FileCheck` unversioned. Without these links they would resolve to
    # bookworm's clang-tidy 14 -- which cannot load a plugin built against
    # LLVM 17, and would fail in a way that looks like a plugin bug.
    - name: point clang-tidy and FileCheck at LLVM 17
      run: |
        set -eu
        mkdir -p "$RUNNER_TEMP/llvm-override"
        ln -sf /usr/bin/clang-tidy-17 "$RUNNER_TEMP/llvm-override/clang-tidy"
        ln -sf /usr/bin/FileCheck-17  "$RUNNER_TEMP/llvm-override/FileCheck"
        echo "$RUNNER_TEMP/llvm-override" >> "$GITHUB_PATH"

    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    # The scoping input. Absent on workflow_dispatch, which is what makes a
    # dispatched run analyse everything (see the trigger comment).
    #
    # Absolute URL: actions/github-script is NOT on code.forgejo.org (checked),
    # so a bare ref would fail at resolution (CDDA_CI_PLAN.md 11.5e).
    - name: determine changed files
      if: ${{ github.event_name == 'pull_request' }}
      uses: https://github.com/actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      with:
        script: |
          const fs = require('fs');
          const response = await github.paginate(github.rest.pulls.listFiles, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
          });
          const files = response.map(x => x.filename);
          for (const path of files) { console.log(path); }
          fs.writeFileSync("files_changed", files.join('\n'));

    # Presentational only -- turns compiler diagnostics into inline annotations.
    # Whether Forgejo honours ::add-matcher:: is unverified; if it does not, the
    # step is inert rather than harmful.
    - uses: https://github.com/ammaraskar/gcc-problem-matcher@cb2e3f949c41b7818628f35f8484a9b0acf90cf9 # master @ 2026-08-15

    # The whole job in one script, upstream's own: configure with the plugin,
    # build CataAnalyzerPlugin, run the 46 lit tests, generate the compile
    # database, resolve affected files, analyse. Its escape hatch is worth
    # preserving -- a change to clang-tidy, build-scripts or cmake escalates to
    # the whole tree, because a scoped run against changed RULES is a false
    # all-clear.
    #
    # THREAD COUNT IS PINNED IN THE SCRIPT, not set here, so a hand-run on this box
    # gets the same safe value instead of it applying only when CI is the caller.
    # THERMALS set that number. Measured 2026-08-16 live at the hardware:
    #
    #   -P3    peak well under 90 C   work migrates between cores, die breathes
    #   -P4    peak 87 C, ZERO throttle events over 2 min at 100 ms sampling  <=
    #   -P6    ~90 C sustained, 96 throttle events; refused to migrate, so the
    #          same few P-cores carried it and stayed hot
    #   -P12   killed early, still reached 100 C on 6 P-cores
    #   -P16   package 100 C (TjMax), cores throttling
    #
    # Confirmed 2026-08-23 under sustained load: 50 min of whole-tree analysis at
    # -P4 peaked at 84 C with a zero throttle delta -- BELOW the 87 C above, which
    # came from a 2-minute sample. The documented figure is conservative.
    #
    # The CPU fan (pwm2) was already at 255/255 in every hot case, so there was no
    # cooling headroom to find; case fans cannot help a saturated die.
    #
    # -P IS THE ONLY LEVER HERE. Narrowing the runner cpuset 0-15 -> 0-11 changed
    # nothing for this job and could not: at 4 threads it is already below both,
    # so the cpuset never binds. That narrowing was for the `nproc` jobs, CBA and
    # iwyu. And clang-tidy is the worst offender in the set -- continuous clang
    # frontends with no link or I/O phase to let the die breathe. A full CBA
    # compile at the same width peaked below 95 C.
    #
    # USE BOTH COUNTERS AND TEMPERATURE, neither alone. The counters
    # (/sys/devices/system/cpu/cpu*/thermal_throttle/) are event-driven and cannot
    # miss an excursion between samples, which is how the -P16 run first looked
    # survivable. But measured 2026-08-22 across every harness run, the counter
    # delta was ZERO while cores sat at 95-96 C -- the hardware did not intervene,
    # so a counter-only test reports "clean" one degree under TjMax. Counters
    # confirm nothing was missed; TEMPERATURE is what you abort on.
    #
    # 4 is measured-safe and ~25% faster than 3. The 4 -> 6 jump is qualitative,
    # not gradual: at 4 the scheduler migrates work and the die cools between
    # bursts; at 6 it parks the load on the same P-cores and holds them hot. The
    # last value on the good side of a cliff, not a point to nudge upward.
    #
    # The untested lever, if it must be faster: the E-cores (cpuset 0-7,16-19)
    # idled at 77 C while P-cores hit 96 C, and every cpuset so far excludes them.
    - name: run clang-tidy
      run: bash ./build-scripts/clang-tidy.sh

    # Which checks cost the most, from the plugin's profiling output --
    # clang-tidy-wrapper.sh adds --enable-check-profile and
    # --store-check-profile=clang-tidy-trace whenever the plugin .so is present.
    # Runs even on failure: a slow check matters most when the job already hurts.
    #
    # PURELY PRESENTATIONAL, SO IT MUST NEVER DECIDE THE JOB. `run:` executes under
    # `bash -eo pipefail`, so any non-zero here reddens a green gate for a reason
    # unrelated to the code under review. `continue-on-error` makes that
    # structural rather than trusting the body to be careful.
    #
    # A `[ -d ]` guard is NOT enough, measured: an existing but EMPTY
    # clang-tidy-trace leaves `clang-tidy-trace/*.json` unexpanded and jq fails
    # with `Could not open file clang-tidy-trace/*.json` -- reachable when
    # clang-tidy runs but dies before writing a profile. Testing the glob covers
    # both the missing and the empty case.
    #
    # The aggregation sums each check's wall time ACROSS all TUs before ranking --
    # verified against real profile shape, including that a check appearing in two
    # files is summed, not counted twice.
    - name: show most time consuming checks
      if: always()
      continue-on-error: true
      run: |
        shopt -s nullglob
        traces=(clang-tidy-trace/*.json)
        if [ ${#traces[@]} -eq 0 ]; then
          echo "No clang-tidy profile output -- nothing was analysed."
          exit 0
        fi
        echo "Aggregating ${#traces[@]} profile files."
        jq -n 'reduce(inputs.profile | to_entries[]) as {$key,$value} ({}; .[$key] += $value)
               | with_entries(select(.key|contains(".wall")))
               | to_entries | sort_by(.value) | reverse | .[0:10] | from_entries' \
          "${traces[@]}"
