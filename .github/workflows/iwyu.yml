name: include-what-you-use

# HackJob's Summary:
# Workflow rebuilt and tested extensively with Claude Opus.
# Its comments are condensed into "caveman" claude and may be a bit confusing.
# Some sections will be referring to items within a plan document not in the repo.
# These are notes for myself and Claude.
# To summarize the rewrite, we upgraded to clang 21 from 17 and minimized relying on external sources.
# Ran it a number of times to estimate how long it takes to run and iron out some issues.
# Ran into some problems and put notes in for if I come back to this and use Claude again.
# More realistically, the only thing that should need editing is the SHA pin and the clang notes.
# There is a note about clang 17 because I am in the process of fixing minor issues
# so that we can fully upgrade all relevant workflows to clang 21, and clang-tidy is the only holdout.
# ~HackJob
#
# Unused #includes, and symbols arriving transitively. Needs a front end, not grep.
# Rebuilt, not retargeted (CDDA_CI_PLAN.md 2.1): upstream's version targets a
# newer CDDA and never ran here. 197 s end to end, measured five times.
#
# ANALYSES ONE CONFIG: TILES=0 SOUND=0 LOCALIZE=0. Cannot reason about the
# others -- the caveat that matters when acting on output. See "WHAT NOT TO TOUCH".
on:
  # No paths: filter. A paths: block is ACCEPTED under workflow_dispatch but has
  # nothing to filter (11.5g) -- it would look like a working filter and be inert.
  workflow_dispatch:

concurrency:
  group: iwyu
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  iwyu:
    runs-on: cdda-ci

    # 197 s measured, five times, within a second of each other. The bound caps
    # a hang; it is not an estimate of the work.
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    # LLVM 21 (was 17). IWYU must match its clang exactly: clang_21 branch goes
    # with llvm-21, nothing else. clang-tidy stays on 17 -- bumping a GATE
    # surfaces 746 findings (CDDA_TOOLCHAIN_PLAN.md step 5); this job is advisory.
    # No apt-get: LLVM 21 is baked (11.4f). Assert it -- absence otherwise
    # surfaces as a confusing cmake error several steps on.
    - name: verify LLVM 21 is present
      run: |
        set -eu
        command -v clang++-21 >/dev/null || {
          echo "clang++-21 missing -- expected it baked into the runner image" >&2
          exit 1
        }
        [ -d /usr/lib/llvm-21 ] || {
          echo "/usr/lib/llvm-21 missing -- IWYU's CMAKE_PREFIX_PATH would not resolve" >&2
          exit 1
        }
        clang++-21 --version | head -1

    # Source build: no distro ships an IWYU matching LLVM 21. Bookworm's 0.18
    # emits 34 libstdc++-internal suggestions where 0.21 emits 8.
    #
    # PINNED BY ASSERTION -- a branch is not a pin, and this runs third-party code
    # over the whole repo. git cannot `--branch` a bare SHA on a shallow clone, so
    # fetch the branch, check the commit after. Pin the head, not a tag (tags lag
    # the clang_NN branches). Failure = upstream patched clang_21: re-verify the
    # tool before trusting a report, then move the SHA.
    - name: build IWYU
      id: iwyu
      run: |
        set -eu
        git clone -q --depth 1 --branch clang_21 \
          https://github.com/include-what-you-use/include-what-you-use.git "$RUNNER_TEMP/iwyu-src"

        got=$( git -C "$RUNNER_TEMP/iwyu-src" rev-parse HEAD )
        want=791e69ea4662cb3e74e8128fd5fd69bd7f4ea6b3 # clang_21 head, 2026-08-22
        [ "$got" = "$want" ] || {
          echo "IWYU clang_21 has moved: expected $want, got $got." >&2
          echo "Re-verify the tool before trusting a report from it, then bump the pin." >&2
          exit 1
        }
        cmake -S "$RUNNER_TEMP/iwyu-src" -B "$RUNNER_TEMP/iwyu-build" \
          -DCMAKE_PREFIX_PATH=/usr/lib/llvm-21 -DCMAKE_BUILD_TYPE=Release
        cmake --build "$RUNNER_TEMP/iwyu-build" --parallel "$(nproc)"
        "$RUNNER_TEMP/iwyu-build/bin/include-what-you-use" --version

    # CONFIGURE ONLY -- no `cmake --build`, none needed. IWYU wants
    # compile_commands.json, which CMake emits at configure time: 2 s / 615 entries.
    #
    # Upstream's `make includes` is dropped because a DISPATCH run has no
    # changed-file set, so an include graph has nothing to answer -- not because
    # it is slow (measured: 614 .inc files, 25.7 MB, 7 s). If this ever gains a
    # pull_request trigger, diff-scoping is viable again at that price;
    # clang-tidy.yml keeps the machinery for exactly that.
    - name: generate compilation database
      run: |
        set -eu
        cmake -B build \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_CXX_COMPILER=clang++-21 \
          -DCMAKE_BUILD_TYPE=Release \
          -DTILES=0 -DSOUND=0 -DLOCALIZE=0 \
          .
        echo "translation units: $( python3 -c 'import json;print(len(json.load(open("build/compile_commands.json"))))' )"

    # ADVISORY. This never fails on findings -- there are findings in most files,
    # and an unused #include breaks nothing. It fails only if IWYU itself could
    # not run, which is the distinction CDDA_CI_PLAN.md 11.6 item 7 insists on:
    # "found nothing" and "did not run" must not look alike.
    #
    # tools/iwyu/cata.imp is the only mapping passed because it is a ref file --
    # it pulls in gcc.stdlib.imp, vs.stdlib.imp and sdl.imp itself.
    # Passing them again changes nothing (measured).
    - name: run include-what-you-use
      run: |
        set -eu
        export PATH="$RUNNER_TEMP/iwyu-build/bin:$RUNNER_TEMP/iwyu-src:$PATH"

        status=0
        python3 "$RUNNER_TEMP/iwyu-src/iwyu_tool.py" \
            -p build -j "$(nproc)" \
            -- -Xiwyu --mapping_file=tools/iwyu/cata.imp -Xiwyu --cxx17ns \
            > "$RUNNER_TEMP/iwyu.txt" 2>&1 || status=$?

        if [ ! -s "$RUNNER_TEMP/iwyu.txt" ]; then
          echo "IWYU produced no output at all -- it did not run." >&2
          exit 1
        fi

        # EXIT STATUS MEANS COVERAGE, NOT FINDINGS. Measured: clean file rc 0,
        # file WITH findings rc 0, file that cannot compile rc 1, missing file
        # rc 1. iwyu_tool.py aggregates `max(exit_code, returncode)`, so non-zero
        # = at least one TU failed to ANALYSE.
        #
        # Ignoring it would make a run that silently skipped files look complete
        # -- the shape 11.6 item 7 forbids. Not fatal (advisory job, and a few
        # unanalysable files are a known property of this tree, 2.7a), but counted
        # and stated so partial coverage is never read as full.
        errors=$( grep -cE '^[^ ]*:[0-9]+:[0-9]+: (fatal )?error:' "$RUNNER_TEMP/iwyu.txt" || true )
        analysed=$( grep -cE 'has correct #includes|should remove these lines' "$RUNNER_TEMP/iwyu.txt" || true )

        # Strip libstdc++ implementation headers from the suggestions.
        # IWYU names the header a symbol literally lives in; for std::chrono that is
        # <bits/chrono.h>, which must never be included directly.
        # The tree's gcc.stdlib.imp maps many of these back to their public headers -- it
        # covers <ext/alloc_traits.h> and <bits/std_abs.h> -- but not all, and
        # <bits/chrono.h> is the one that survives. Removing them here keeps the
        # report actionable; the count is printed so their absence is visible.
        internal=$( grep -cE '^\+?#include <(bits|ext)/' "$RUNNER_TEMP/iwyu.txt" || true )
        grep -vE '^\+?#include <(bits|ext)/' "$RUNNER_TEMP/iwyu.txt" > "$RUNNER_TEMP/iwyu-clean.txt"

        # SUMMARY FIRST, DETAIL AFTER. The report runs to ~32,000 lines; a
        # footer would put the one thing you must read -- whether coverage was
        # complete -- 32,000 lines below the fold.
        echo "================================================================"
        echo "include-what-you-use summary"
        echo "  sections reported          $analysed"
        echo "  libstdc++-internal hidden  $internal   (<bits/...>, <ext/...>)"
        echo "  compiler errors            $errors"
        if [ "$status" -ne 0 ]; then
          echo ""
          echo "  COVERAGE IS INCOMPLETE. IWYU exited $status, which means at"
          echo "  least one translation unit could not be analysed -- findings"
          echo "  alone leave the status at 0. Those files are ABSENT from the"
          echo "  report below, not clean."
        else
          echo "  every translation unit analysed successfully (exit 0)"
        fi
        echo "================================================================"
        echo ""

        # THE REPORT ITSELF. The counters above are an index to this; the job
        # exists to produce it. It was briefly deleted during a sweep -- the
        # `cat` sat inside the footer block that got replaced by the summary --
        # and nothing failed, because every counter is computed from the FILE
        # rather than from what was printed. A workflow can lose its entire
        # output and still look healthy.
        cat "$RUNNER_TEMP/iwyu-clean.txt"
        echo ""
        echo "WHAT NOT TO TOUCH, whatever the report says:"
        echo ""
        echo "  1. <bits/...> and <ext/...>  -- libstdc++ internals. Filtered"
        echo "     above, but if any reach you: include the PUBLIC header"
        echo "     instead (<chrono>, <cstdlib>, <string>). These paths do not"
        echo "     exist on MSVC or libc++ and change between GCC releases."
        echo ""
        echo "  2. Anything used only under TILES/SOUND/LOCALIZE. This run"
        echo "     configured with all three OFF, so IWYU never saw the SDL or"
        echo "     gettext code paths and will call their includes unused."
        echo "     Removing one breaks the tiles build and nothing here catches"
        echo "     it -- msvc-full-features would, weeks later."
        echo ""
        echo "  3. Platform headers inside #ifdef _WIN32 / __ANDROID__ and the"
        echo "     like, for the same reason: one configuration was analysed."
        echo ""
        echo "  4. Includes kept for side effects rather than symbols -- headers"
        echo "     pulled in for a macro, a static initialiser, or an operator"
        echo "     overload found by ADL. IWYU reasons about named entities and"
        echo "     under-counts these."
        echo ""
        echo "  5. The precompiled-header include, where present."
        echo ""
        echo "  6. Anything that looks marginal on a DIFFERENT toolchain. This"
        echo "     analysis runs clang 21 against libstdc++ 12. The game is"
        echo "     built here by clang 14 and g++ 12, on the laptop by MinGW"
        echo "     GCC, and by MSVC in release. Which header a symbol arrives"
        echo "     through differs between standard libraries, so a removal that"
        echo "     is correct under libstdc++ can break the MSVC build."
        echo ""
        echo "AND AFTER ACTING ON REMOVALS, RUN THIS AGAIN. Deleting an include"
        echo "from a header is exactly what turns someone else's transitive"
        echo "dependency into a missing one. The second pass is what makes the"
        echo "first pass safe -- a missing include compiles fine here and fails"
        echo "on MinGW or MSVC, which is where this repository actually builds."
