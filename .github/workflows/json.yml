name: JSON Validation

# HackJob's Summary:
# Workflow rebuilt and tested extensively with Claude Opus.
# Its comments are condensed into "caveman" claude and may be a bit confusing.
# Some sections will be referring to items within a plan document not in the repo.
# These are notes for myself and Claude.
# To summarize the rewrite, we pinned the version and minimized relying on external sources.
# ~HackJob

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/json.yml'
      - 'Makefile'
      # The checked corpus is exactly `find data -name "*.json"`, so the filter
      # can name it exactly. The other 45 JSON files in the tree -- .vscode,
      # gfx, build-scripts, tools -- are not checked and must not trigger.
      - 'data/**/*.json'
      # json_formatter's own sources. A change here changes what "correctly
      # formatted" means, so the corpus has to be re-checked even though no
      # data file moved. The Makefile builds it from
      # `$(wildcard tools/format/*.cpp) src/wcwidth.cpp src/json.cpp`.
      - 'tools/format/*.cpp'
      - 'tools/format/*.h'
      - 'src/json.cpp'
      - 'src/json.h'
      - 'src/wcwidth.cpp'
      - 'src/wcwidth.h'

concurrency:
  group: json-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  style-json:
    name: JSON style check

    runs-on: cdda-ci

    # ~7 s for the whole job: the g++ build of json_formatter plus all 5,379
    # files. The default is 360 minutes, and this runner shares the box with
    # Samba and the pool.
    timeout-minutes: 15

    steps:
    # persist-credentials: false because nothing here pushes. The default leaves
    # a token in the workspace .git/config for the life of the job.
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    # No tool-presence guard, unlike astyle.yml: json_formatter is a make
    # prerequisite, so a missing binary gets built and a failed build fails the
    # job -- no path reports success without checking. RELEASE=1 is inert for
    # this target but kept to match what runs on GitHub.
    - name: JSON style check
      id: style_json
      run: make style-all-json-parallel RELEASE=1

    - name: Display Corrections
      if: failure() && steps.style_json.outcome == 'failure'
      run: git diff --color
