name: "Pull Request Labeler"

# Its rule set lives at .github/labeler.yml -- that path is the action's default
# `configuration-path`, so it is fixed, not a convention.
#
# WHAT THIS IS FOR HERE, which is not what it is for upstream. Upstream gets one
# pull request per focused change, so a label means "this change touched mapgen".
# In this fork ordinary work is built and tested on the laptop and pushed
# straight to `experimental` with no pull request; PRs exist almost solely for
# `experimental` -> `master`, which is the release. So a label here means
# "this RELEASE touched mapgen" (CDDA_CI_PLAN.md 2.5). Judge the label set by
# whether it usefully describes a release, not whether it pinpoints one change.
#
# The 64 labels in the config must ALREADY EXIST in Forgejo. actions/labeler
# applies labels; it does not create them.

on:
  # No paths: filter, and that is not an oversight. Not every file matches a rule
  # -- 206 of 8,938 match none, mostly android/, msvc-full-features/ and
  # dotfiles -- so a PR can legitimately come back unlabelled, and that is the
  # correct outcome rather than something to filter for. A paths: list here would
  # have to mirror all 64 rules to avoid suppressing a PR that does match, and
  # the two copies would drift. Let the config decide; this trigger just supplies
  # the pull requests.
  #
  # No workflow_dispatch either: this needs a pull request for its context, so a
  # Run button would be a control that cannot work. A trigger with nothing to act
  # on is worse than an absent one (CDDA_CI_PLAN.md 11.5g).
  - pull_request_target

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  triage:
    # THIS BLOCK IS THE MODEL FOR 6.2 -- least grant, stated per job, with the
    # reason each is needed written beside it. Upstream got this one right.
    permissions:
      contents: read        # read the changed-file list
      pull-requests: write  # apply labels to the PR

    runs-on: cdda-ci

    # NOT one API call -- the changed-file list is PAGINATED
    # (`client.paginate(pulls.listFiles)`), so cost scales with the size of the
    # pull request, roughly one request per 100 files. That is nothing for a
    # normal PR and non-trivial for a release aggregating months of work, which
    # is the only kind this repository opens. 10 minutes is headroom for that
    # paging plus a slow forge, not a description of the work.
    #
    # Worth knowing for the same reason: if the forge caps how many files it will
    # report for one pull request, the list arrives TRUNCATED and labels are
    # computed from a partial view -- silently, since a short list looks like a
    # small PR. Forgejo's limit, if any, is unmeasured. If a large release ever
    # comes back with visibly too few labels, suspect this before the config.
    timeout-minutes: 10

    steps:
      # PINNED BY SHA, AND THE PIN IS PROTECTING A SCHEMA, NOT JUST A VERSION.
      # This SHA is v4.3.0. actions/labeler@v5 rewrote the config format --
      # v4 reads `label: [globs]`, v5 requires `changed-files:` /
      # `any-glob-to-any-file:` wrappers -- so drifting from v4 to v5 would not
      # error, it would silently stop matching all 64 rules and label nothing.
      # `@v4` would not protect against that either: it is a moving major tag,
      # today pointing at this same commit, free to move tomorrow.
      #
      # THE ABSOLUTE URL IS LOAD-BEARING. A bare `actions/labeler@<sha>` does not
      # mean github.com here: the runner resolves unqualified `uses:` against
      # code.forgejo.org, which mirrors a small curated set. checkout and
      # upload-artifact are there; **actions/labeler is NOT** -- measured, and it
      # is the counter-example proving "actions/* resolve" is not a rule
      # (CDDA_CI_PLAN.md 11.5e). Written bare, this job fails at resolution.
      #
      # `pull_request_target` IS SAFE IN THIS FILE, and the distinction is worth
      # stating because linter.yml was dropped partly for using it (2.0). That
      # trigger is dangerous when a job CHECKS OUT PULL REQUEST CODE, because the
      # code then runs with a write token against the base repository. There is
      # no checkout step here at all: actions/labeler reads the changed-file list
      # from the API and applies labels. No pull-request code executes. The
      # trigger is used rather than `pull_request` so labelling still works if a
      # PR ever arrives from a fork, where the token would otherwise be read-only.
      #
      # STILL UNVERIFIED, and only a real PR can settle it: whether Forgejo's
      # issues/labels API answers what actions/labeler calls. That is wave C,
      # shared with summary-labeler. Note the two hit the labels API while
      # linter's reviewdog used the REVIEWS API -- separate surfaces that can
      # fail independently, so a green result here would not have proven
      # reviewdog anything.
      - uses: https://github.com/actions/labeler@ac9175f8a1f3625fd0d4fb234536d26811351594 # v4.3.0
        with:
          # repo-token IS DELIBERATELY NOT PASSED, where upstream passes
          # "${{ secrets.GITHUB_TOKEN }}". action.yml already defaults it to
          # `${{ github.token }}`, and that default applies only when the input
          # is ABSENT -- an input supplied as an empty string stays empty and
          # wins. So naming a secret that this forge might not populate is
          # strictly worse than naming none: it converts "fall back to the job
          # token" into "run with no token".
          #
          # Which of the two Forgejo actually fills is UNMEASURED. Both
          # GITHUB_TOKEN and GITEA_TOKEN appear in the forgejo and
          # forgejo-runner binaries, so the compatibility layer clearly knows
          # them, but `forgejo-runner exec` mints no token at all -- both
          # `secrets.GITHUB_TOKEN` and `github.token` come back empty locally --
          # so the local harness cannot answer this. Only a real run can, and
          # that is wave C along with the label API itself.
          # SET EXPLICITLY BECAUSE THE CONFIG'S CORRECTNESS DEPENDS ON IT.
          # false is already the action's default, so this changes no behaviour
          # today -- it makes an invisible dependency visible. Nearly every rule
          # in .github/labeler.yml is `**/`-prefixed, and with dot false those
          # cannot traverse a dot-leading directory, which is the only reason
          # content labels do not fire on .github/ churn. `.github/**` still
          # matches for Code: Tooling because its dot is written literally.
          # Flip this to true and rules like `**/**spell**` immediately start
          # catching post-spell-check-result.yml (measured against real
          # minimatch). Do not, without re-auditing the config first
          # (CDDA_CI_PLAN.md 2.5a).
          dot: false
          # Upstream's comment was "I don't want no bot removing stuff for me",
          # and the intent is preserved deliberately. Labels are only ever ADDED:
          # one applied to a release PR stays applied even if later commits stop
          # matching its rule. For a release-scale PR that is what is wanted --
          # the label records that the release touched an area at some point,
          # which is exactly the summary this workflow exists to produce.
          #
          # THE EMPTY STRING IS NOT A TYPO, AND `false` WOULD MEAN THE OPPOSITE.
          # This input is read as `!!core.getInput('sync-labels')` -- a plain
          # string coerced to boolean, not a parsed boolean. "" is falsy, so it
          # disables syncing. Writing `sync-labels: false` yields the STRING
          # "false", which is truthy, silently turning label removal ON. Note
          # `dot` above is the opposite case -- getBooleanInput, which is strict
          # -- so the two inputs on this same step disagree about how to spell a
          # boolean. Copy neither onto the other.
          sync-labels: ""
