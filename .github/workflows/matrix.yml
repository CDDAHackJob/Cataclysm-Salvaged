name: General build matrix

# HackJob's Summary:
# Workflow rebuilt and tested extensively with Claude Opus.
# Its comments are condensed into "caveman" claude and may be a bit confusing.
# Some sections will be referring to items within a plan document not in the repo.
# These are notes for myself and Claude.
# Matrix was one of the last workflows rebuilt and saw the most extensive rebuild.
# The selection of compile jobs it ran was outdated and incompatible with my setup.
# I am on debian 12, upstream runs this on github's ubuntu and builds with that in mind.
# The tests were redone to work off of a slim debian 12 image and a similar ubuntu 24.04 image.
# This tests things a bit more comprehensively than upstream.
# The thermal load on these is extensive, and any tweaks to the thread count should be made with caution.
# I tried speeding this thing up a bunch of ways in a relatively cool room and I couldn't safely do it.
# I am on a mini-ITX board and case, with a decently sized air cooler despite the smaller size, alder lake CPU.
# So anything less than a desktop case with a full size air cooler, or a beefy liquid cooler is not enough.
# ~HackJob
#
# THE ONLY WORKFLOW THAT BUILDS AND RUNS THE GAME. Everything else in this set
# inspects the tree; this compiles it, links it, and executes the test suite.
#
# REWRITTEN, NOT RETARGETED (CDDA_CI_PLAN.md 11.11). Of upstream-2024's seven
# variants, 2 named retired runner images, 4 named compilers Debian 12 cannot
# provide, and 1 was macOS -- nothing survived untouched, so the list was rebuilt
# from upstream's stated strategy rather than patched toward it.
#
# THAT STRATEGY, quoting upstream's own header: "We try to minimize the number of
# builds subject to those constraints." SAMPLE THE SPACE, DO NOT GRID IT. The
# dimensions -- compiler family, compiler age, stdlib age, UI backend, build
# flags -- cross to hundreds of jobs, so each job varies several at once and two
# are crossed ONLY when the crossing is itself under test. Accepted cost: when a
# job varying three things goes red, you bisect by hand.
#
#   host     compiler      UI       flags                    tests
#   Debian   g++-11        Curses   LOCALIZE=0, PCH=0        launch only
#   Debian   g++-12        Tiles+Snd CMAKE=1                 narrow spec
#   Debian   clang++-21    Tiles    SANITIZE=addr,undef      YES
#   Debian   g++-12 MinGW  Tiles+Snd cross, wine             YES
#   Ubuntu   g++-14        Curses   LTO=1, TEST_STAGE, MODS  YES
#   Ubuntu   g++-14        Tiles    LTO=1, TESTS=0           -
#   Ubuntu   clang++-21    Tiles    -                        -
#   Debian   g++-12        Tiles+Snd bindist                 YES  <- last, on purpose
#
# ONE RUNNER, CAPACITY 1: all eight SERIALIZE, so ORDER IS EXECUTION ORDER. The
# release candidate runs LAST, giving its artifact every other toolchain's
# verdict behind it rather than in front. Parallelism exists only inside a job.
#
# COVERAGE, reading the table: each UI backend meets an old compiler and a new
# one, and the 12,673 lines of TILES-conditional code are reached by LTO/ODR as
# well as by the sanitizers -- invisible to both before the restructure.
#
# THE TWO clang++-21 JOBS ARE A DIFFERENTIAL PAIR and must stay single-variable:
# same compiler, same UI, only the stdlib differs (libstdc++ 12 on Debian, 14 on
# Ubuntu). That instrument classified 14 get_temporary_buffer diagnostics as a
# stdlib artifact rather than a code defect. Change either one's UI, flags or
# sanitizers and the pair stops being a comparison.
#
# g++-16 -fsyntax-only IS DELIBERATELY NOT HERE. syntax-check.yml already
# implements it (replay compile_commands.json with codegen stripped) and the
# gha_* scripts this workflow drives have no syntax-only path, so adding it would
# mean a second divergent implementation. syntax-check.yml holds exactly the
# compilers this matrix does not build.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

    # NO `paths:` FILTER, DELIBERATELY. Every other workflow here scopes itself.
    # This one builds and TESTS the game, so its verdict depends on source,
    # headers, build system, build scripts AND the JSON in data/ that the suite
    # loads -- very nearly the whole tree. Enumerating that is all risk and no
    # saving (11.6 item 7: a check that cannot trigger silently passes).

  # Pull requests here happen only at release (experimental -> master), so the
  # matrix runs about once per release. Without dispatch, the first time any of
  # these eight toolchains sees a change is months after it was written -- same
  # reasoning as clang-tidy.yml and syntax-check.yml.
  workflow_dispatch:

# Native concurrency, replacing upstream's TWO skip-duplicates jobs
# (fkirc/skip-duplicate-actions@master -- a mutable branch ref, one of the four
# the plan wants gone). They also ran on `ubuntu-latest`, which this runner does
# not answer to, so they would have queued forever.
concurrency:
  group: matrix-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

# No API calls here -- upstream's `secrets: inherit` fed the emscripten job,
# which is dropped (11.8), and nothing else needs a token.
permissions:
  contents: read

jobs:
  varied_builds:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}

    name: ${{ matrix.title }}
    runs-on: ${{ matrix.host }}

    strategy:
      # FALSE, DELIBERATELY, AND IT COSTS TIME. The point of eight varied jobs is
      # to learn WHICH toolchains break; stopping at the first failure answers
      # that for one of them and hides the rest. Since the jobs serialize, a
      # broken tree burns the full matrix -- the price of one complete report per
      # release instead of one finding per release.
      fail-fast: false

      # Documentation more than enforcement: the runner is capacity 1, so these
      # serialize regardless. Stated so that raising runner capacity later does
      # not silently start eight concurrent builds on a box whose binding
      # constraint is HEAT (11.5h).
      max-parallel: 1

      matrix:
        include:
          # Oldest compiler still supported -- its AGE is the test, which is why
          # the image asserts g++-11 is really 11.x: silently resolving to 12
          # would duplicate the next job and still report green. LOCALIZE=0
          # covers upstream's flag list. No suite; g++-14 Curses runs one below.
          #
          # PCH=0 IS NOT A DUPLICATE. Precompiled headers are on by default
          # (Makefile 232-233, `ifndef PCH`), so every other Makefile job builds
          # WITH them, and a tree that only compiles because a PCH drags in a
          # header goes green everywhere else. This is the non-PCH build on the
          # build system we actually ship.
          #
          # `launch: 1` runs `--version` only: a link proves symbols resolve,
          # starting up proves the binary initialises. IT MUST NOT RUN
          # `--check-mods` -- measured 2026-08-21, on a CURSES build with no TTY
          # it HANGS, `--version` printing and then nothing until the 120-minute
          # timeout. `--version` exits before `game_ui::init_ui()`
          # (main.cpp:796); `--check-mods` does not, and ncurses blocks with no
          # terminal. Tiles is unaffected (SDL initialises headlessly), which is
          # why the release job can run it.
          - title: GCC 11, Debian, Curses, LOCALIZE=0, PCH=0
            host: cdda-ci
            compiler: g++-11
            tiles: 0
            sound: 0
            localize: 0
            pch: 0
            launch: 1
            id: debian-gcc-11-curses

          # The CMake build path. Upstream keeps one and so do we: CMakeLists.txt
          # and the Makefile drift apart, and only this job notices. Runs a
          # NARROW spec, not the full suite -- not for test coverage (the
          # sanitizer and Ubuntu Curses jobs already run these sources) but
          # because the CMake branch of gha_test_only.sh was DEAD CODE: its
          # `parallel` invocation, run_test wrapper, sed prefixing and exit-code
          # plumbing had never once executed (CDDA_CI_PLAN.md gap 2). A narrow
          # spec exercises all of it in minutes instead of an hour, and this is
          # the only job that runs a CMake-built binary at all.
          - title: GCC 12, Debian, Tiles, Sound, CMake
            host: cdda-ci
            compiler: g++-12
            tiles: 1
            sound: 1
            localize: 1
            cmake: 1
            run_tests: 1
            cmake_test_specs: "[json]"
            id: debian-gcc-12-cmake

          # Sanitizers. THIS JOB MUST RUN THE SUITE OR IT IS WORTHLESS: ASan and
          # UBSan report when code EXECUTES, so a build-only sanitizer job finds
          # literally nothing.
          #
          # -Wno-error=deprecated-declarations is REQUIRED, not tidiness. Clang
          # 21 against libstdc++ 12 reports 14 deprecated get_temporary_buffer
          # diagnostics, one per std::stable_sort in the tree, from inside the
          # standard library's own headers -- unfixable in project code short of
          # abandoning stable sorting. Clang blames the INSTANTIATION POINT, your
          # stable_sort call, so it reads as a defect here; GCC never shows it,
          # suppressing diagnostics that arise in its own headers. Isolated by
          # controlled experiment (CDDA_TOOLCHAIN_PLAN.md 1.2):
          #   Clang 21 x libstdc++ 12  -> fires, 14 diagnostics
          #   Clang 21 x libstdc++ 14  -> clean
          # Same compiler; the standard library is the variable. So the flag
          # becomes unnecessary if the build host ever moves to Debian 13, and it
          # is scoped to THIS job for exactly that reason. -Wno-error= rather
          # than -Wno-: the diagnostics stay VISIBLE, so a genuine deprecation in
          # project code is not hidden by the flag that exists to tolerate the
          # standard library's own.
          - title: Clang 21, Debian, Tiles, ASan+UBSan
            host: cdda-ci
            compiler: clang++-21
            tiles: 1
            sound: 0
            localize: 1
            sanitize: address,undefined
            cxxflags: -Wno-error=deprecated-declarations
            run_tests: 1
            id: debian-clang-21-asan

          # The operator's own Windows toolchain, and the only job whose binary is
          # a PE. MXE is NOT involved: pkg.mxe.cc publishes nothing for bookworm,
          # so the image uses Debian's mingw-w64 plus libsdl.org's official MinGW
          # tarballs (11.11).
          #
          # THE -posix THREAD MODEL IS LOAD-BEARING, asserted in the image: under
          # win32 threads libstdc++ has no std::this_thread::sleep_for and three
          # files call it with no shim. Tests run under wine64, WINEPATH set over
          # BOTH the sysroot bin (SDL2*.dll) and lib (libwinpthread-1.dll, pulled
          # in by the posix thread model and NOT covered by -static-libgcc
          # -static-libstdc++). A missing DLL exits 53 with no message.
          - title: GCC 12, Debian cross-compile to MinGW-Win64, Tiles, Sound
            host: cdda-ci
            compiler: g++
            cross: x86_64-w64-mingw32-
            wine: wine64
            tiles: 1
            sound: 1
            localize: 1
            # STATIC=1 IS REQUIRED, and it is one line in the Makefile (757): it
            # selects `pkg-config --static --libs` over plain `--libs`. Measured
            # 2026-08-18, the two differ by exactly the symbols the link was
            # missing:
            #   plain : -lmingw32 -lSDL2main -lSDL2 -mwindows
            #   static: ... -lsetupapi -lole32 -loleaut32 -limm32 -lwinmm
            #           -ldinput8 -ldxguid -lversion -luuid ...
            # Without it the game links but tests/cata_test.exe does NOT, with
            # undefined references to __imp_SetupDi*, __imp_CM_* and Uniscribe --
            # Windows system imports pulled in by the STATIC libSDL2.a the linker
            # resolves (both .a and .dll.a are installed). It also matches
            # upstream, whose MXE target was `x86_64-w64-mingw32.static.gcc12`,
            # and yields a self-contained binary needing no SDL2 DLLs alongside.
            static: 1
            ldflags: -static-libgcc -static-libstdc++
            run_tests: 1
            id: debian-mingw-gcc-12

          # The modern matched pair -- compiler and libstdc++ from one release --
          # and the ONLY job with ODR detection, since -Wodr functions only under
          # LTO. Upstream pairs LTO with its OLDEST GCC to save a job slot, which
          # runs the check with the least capable detector; it sits on g++-14 here.
          #
          # TEST_STAGE rides here rather than on g++-11: its second half
          # force-loads every mod combination via get_all_mods.py and runs only
          # in the TEST script, so a job that does not run tests would silently
          # discard half of it.
          - title: GCC 14, Ubuntu, Curses, LTO, ODR
            host: cdda-ci-ubuntu
            compiler: g++-14
            tiles: 0
            sound: 0
            localize: 1
            lto: 1
            test_stage: 1
            run_tests: 1
            # THIS JOB CARRIES ALL THE MOD AND BACKTRACE COVERAGE, deliberately
            # clustered rather than spread: it already runs TEST_STAGE, whose
            # second half force-loads every mod combination, and it is the
            # cheapest suite to double (Curses, no sanitiser, no wine).
            #
            # libbacktrace: upstream pairs it with their LTO variant too, and the
            # MinGW job gets it automatically -- together, upstream's stated
            # "Linux and Windows".
            #
            # mods: runs the WHOLE SUITE A SECOND TIME with Magiclysm enabled --
            # distinct from TEST_STAGE, which proves the data LOADS but runs no
            # tests. COST: roughly +1050 s, taking this job from ~25 to ~42 min.
            # The single most expensive line in this file; if the matrix ever
            # needs to get cheaper, start here.
            libbacktrace: 1
            mods: --mods=magiclysm
            id: ubuntu-gcc-14-lto

          # ODR OVER THE TILES SOURCES. Job 5 runs -Wodr on a Curses build, which
          # never compiles the 12,673 lines behind TILES -- so a one-definition-
          # rule violation in the tiles frontend was invisible to the whole
          # matrix. ODR is a LINK-time check, so this needs no suite at all.
          #
          # TESTS=0 skips building tests/ entirely (213 test TUs of 604 total, so
          # ~35% off the compile) and costs nothing here: ODR between the game
          # and its test binary is the Ubuntu Curses job's business. TESTS is
          # `ifndef`-guarded (Makefile 212-213), so the environment genuinely
          # sets it -- unlike LOCALIZE.
          - title: GCC 14, Ubuntu, Tiles, LTO, ODR
            host: cdda-ci-ubuntu
            compiler: g++-14
            tiles: 1
            sound: 0
            localize: 1
            lto: 1
            tests: 0
            id: ubuntu-gcc-14-lto-tiles

          # New frontend x new stdlib -- the one deliberate crossing, and why this
          # matrix has eight jobs rather than the restructure's seven. Clang on
          # Debian 12 uses GCC 12's standard library (verified: "Selected GCC
          # installation: .../gcc/x86_64-linux-gnu/12"), so the Debian Clang job
          # sees OLD headers however new its Clang is. Without this one, Clang
          # against a modern libstdc++ is built nowhere -- the pairing an Arch or
          # Fedora user actually has. Build-only: -Wodr is a GCC feature so this
          # cannot take the Ubuntu Tiles LTO job's role, and the runtime it would
          # exercise is already covered by Ubuntu Curses on the same stdlib.
          - title: Clang 21, Ubuntu, Tiles
            host: cdda-ci-ubuntu
            compiler: clang++-21
            tiles: 1
            sound: 0
            localize: 1
            id: ubuntu-clang-21-tiles

          # THE RELEASE CANDIDATE, the only job producing something a person could
          # install. Everything else proves the tree compiles under some
          # toolchain; this proves the thing we would actually ship builds,
          # starts, passes its suite, and packages.
          #
          # DELIBERATELY LAST. The jobs serialize on one runner, so matrix order
          # is execution order: every toolchain has had its say before the
          # candidate is built. Moving it earlier would mean packaging a tree
          # that later jobs then found fault with.
          #
          # A native Debian Tiles+Sound Makefile build, which existed NOWHERE in
          # the matrix before -- the CMake job is CMake, the sanitizer job drops
          # sound and instruments everything, the MinGW job is a PE cross-build.
          # The configuration closest to a release was the one never built.
          #
          # `RELEASE: 1` is in the job-wide env for EVERY job, so it is NOT the
          # differentiator; the native Tiles+Sound Makefile build and the
          # launch/package steps below are. bindist is the packaging step -- a
          # tree can build and test cleanly and still fail to package (missing
          # data file, bad path), and nothing else here would notice.
          - title: GCC 12, Debian, Tiles, Sound, RELEASE
            host: cdda-ci
            compiler: g++-12
            tiles: 1
            sound: 1
            localize: 1
            run_tests: 1
            launch: 1
            check_mods: 1
            bindist: 1
            id: debian-gcc-12-release

    env:
      # The Makefile reads COMPILER from the environment (Makefile:366), and
      # treats it as clang when the string contains "clang" (Makefile:249), so
      # this one variable selects the toolchain for every job.
      COMPILER: ${{ matrix.compiler }}
      CROSS_COMPILATION: ${{ matrix.cross }}
      WINE: ${{ matrix.wine }}
      CMAKE: ${{ matrix.cmake }}
      TILES: ${{ matrix.tiles }}
      SOUND: ${{ matrix.sound }}
      LOCALIZE: ${{ matrix.localize }}
      LTO: ${{ matrix.lto }}
      # Both restored after a bugsweep found them missing from the rewrite
      # (2026-08-19). Upstream's own header lists each as something it wants
      # covered in at least one PR build, and neither survived the row-14 rewrite:
      #
      #   LIBBACKTRACE=1 (on Linux and Windows)
      #   Tests with important mods enabled (Magiclysm)
      #
      # LIBBACKTRACE was covered on Windows only, and BY ACCIDENT -- the Makefile
      # auto-enables it for any mingw cross build, which is why that job needed
      # backtrace.h at all. No Linux job had it; measured, `-DLIBBACKTRACE`
      # appeared in the MinGW logs and nowhere else. No image change needed:
      # `g++-12 -lbacktrace` resolves against GCC's own internal copy.
      #
      # MODS drove an entire branch of gha_test_only.sh that HAD NEVER EXECUTED
      # in any of the nine job runs -- a documented check and dead code at once.
      LIBBACKTRACE: ${{ matrix.libbacktrace }}
      MODS: ${{ matrix.mods }}
      # Read only by the CMake branch of gha_test_only.sh; empty everywhere else,
      # where the branch's default full split applies.
      CMAKE_TEST_SPECS: ${{ matrix.cmake_test_specs }}
      # BOTH ARE `ifndef`-GUARDED IN THE MAKEFILE (PCH at 232-233, TESTS at
      # 212-213), so unlike LOCALIZE the environment really does set them. An
      # unset value leaves the Makefile default (PCH=1, TESTS=1) intact, which is
      # what every other job wants.
      PCH: ${{ matrix.pch }}
      TESTS: ${{ matrix.tests }}
      # STATIC reaches the Makefile from here because it is never ASSIGNED there,
      # only tested at line 757. Contrast LOCALIZE, which carries an
      # unconditional `LOCALIZE = 1` and ignores the environment entirely -- that
      # one has to go on the make command line instead.
      STATIC: ${{ matrix.static }}
      SANITIZE: ${{ matrix.sanitize }}
      TEST_STAGE: ${{ matrix.test_stage }}
      CXXFLAGS: ${{ matrix.cxxflags }}
      LDFLAGS: ${{ matrix.ldflags }}
      RELEASE: 1
      EXTRA_TEST_OPTS: --error-format=github-action
      # CCACHE_LIMIT is gone with the cache step — it existed only to size a
      # directory that was about to be persisted. The three tuning flags below
      # still apply to ccache's within-run behaviour, which is unchanged.
      CCACHE_FILECLONE: true
      CCACHE_HARDLINK: true
      CCACHE_NOCOMPRESS: true

      # 4, MEASURED. Raising it was tried and rejected: 5 and 6 both drive cores
      # past 94 C on this cooling, and the wall-time gain does not justify
      # running that close to TjMax. HEAT is the binding constraint here, not
      # wall time (11.5h).
      #
      # Per-variant override kept: `build_jobs` on a variant wins, so one job can
      # be capped without moving the rest. If this expression ever yields empty,
      # `gha_compile_only.sh`'s own `${CDDA_BUILD_JOBS:-4}` lands on the same 4.
      CDDA_BUILD_JOBS: ${{ matrix.build_jobs || 4 }}

      # 3, AND RAISING IT DOES NOTHING. `parallel` is fed exactly two Catch2 specs
      # (`[slow] ~starting_items` and `~[slow] ~[.],starting_items`), so two run
      # concurrently and the third slot never fills. The knob is not the
      # constraint, the spec list is; left at upstream's 3 because it costs
      # nothing. Splitting the suite further was measured and rejected on thermal
      # grounds (see gha_test_only.sh) -- the binary is a game simulation and runs
      # hotter per process than a compile, so any future split must re-measure.
      NUM_TEST_JOBS: 3

    # The heaviest job measured end to end at ~25 min (build 433 s + suite
    # 1056 s over 1111 cases and 49.6M assertions). 120 is ~5x that. The MinGW
    # job is the unknown -- its suite runs through wine, which has never been
    # timed here -- so the headroom is deliberate.
    #
    # NOTE: forgejo-runner's own `timeout:` in config.yaml is a SEPARATE ceiling,
    # checked first, and the LOWER of the two wins with nothing in the log naming
    # which fired. It is currently 5h. Change both together.
    timeout-minutes: 120

    steps:
    # NO apt-get. LLVM 21 is baked into cdda-ci (11.4f) -- clang-21,
    # libclang-rt-21-dev and llvm-21 all arrive with the image, which ASSERTS
    # each of them, so the install this step used to carry was removed
    # 2026-08-22. The Dockerfile owns why each package is there, including why
    # compiler-rt is not optional for a job that LINKS a sanitized binary.
    #
    # The baked clang is pinned to match cdda-ci-ubuntu (both 21.1.8). If the two
    # ever drift, the differential pair above stops being single-variable and
    # quietly becomes two unrelated jobs.
    #
    # WHAT REMAINS IS NOT OPTIONAL. ASAN_SYMBOLIZER_PATH still has to be exported
    # per job: sanitizers find the symbolizer through this variable or through
    # `llvm-symbolizer` on PATH, and it installs under a VERSIONED prefix that is
    # on neither -- baking the package does not put it on PATH. Without this,
    # UBSan's print_stacktrace=1 emits raw addresses:
    #
    #   WARNING: invalid path to external symbolizer!
    #   #0 0x561d70e19770  (tests/cata_test+0x5b10770)
    #
    # The source line still appears, because UBSan prints the failing check's own
    # location -- but the STACK cannot name what reached it. That is the
    # difference between tracing the relic UB to its procgen call site and
    # knowing only that something divided by zero.
    - name: point the sanitizers at the symbolizer (Debian clang only)
      if: ${{ matrix.host == 'cdda-ci' && startsWith(matrix.compiler, 'clang') }}
      run: |
        set -eu
        clang++-21 --version | head -1
        test -x /usr/lib/llvm-21/bin/llvm-symbolizer \
          || { echo "FATAL: llvm-symbolizer missing -- sanitizer traces would be raw addresses"; exit 1; }
        echo "ASAN_SYMBOLIZER_PATH=/usr/lib/llvm-21/bin/llvm-symbolizer" >> "$GITHUB_ENV"

    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    # NO CACHE STEP, A DECISION RATHER THAN AN OMISSION (2026-08-19). Upstream
    # persists ccache between runs via actions/cache. UNAVAILABLE HERE for a
    # reason no workflow change can reach: the runner's cache proxy is
    # UNREACHABLE FROM JOB CONTAINERS. ufw defaults to `deny (incoming)`, there
    # is no rule for the Docker subnet, and the proxy binds an ephemeral port.
    # Proven by direct test -- a listener on a high port was unreachable from a
    # container over BOTH the LAN IP and the Docker bridge IP, while port 22
    # succeeded only because it has an explicit ufw rule.
    #
    # Measured over 13 job runs before this was understood: every
    # `getCacheEntry`/`reserveCache` times out, nothing is stored,
    # `~/.cache/actcache/bolt.db` never grows, hit rate 0. Two genuine config
    # bugs were fixed earlier -- a fallback key nothing writes, and a `clear
    # ccache on PRs` step that emptied the directory before saving -- but fixing
    # them changed nothing.
    #
    # RE-ENABLING IS A FIREWALL DECISION, NOT A WORKFLOW ONE: pin `proxy_port` in
    # config.yaml and allow that one port from 172.17.0.0/16. Declined
    # 2026-08-19 in favour of cold builds -- roughly 7 min per affected job at
    # release cadence -- rather than widening ufw for a build accelerator.
    #
    # `CCACHE=1` remains in gha_compile_only.sh, so the build invocation is
    # unchanged; only between-run persistence is gone.

    # Presentational only. Whether Forgejo honours ::add-matcher:: is unverified;
    # if it does not, the step is inert rather than harmful.
    - uses: https://github.com/ammaraskar/gcc-problem-matcher@cb2e3f949c41b7818628f35f8484a9b0acf90cf9 # master @ 2026-08-15

    # THE LTO JOB'S -Werror EXEMPTION, and it is not optional: without it the LTO
    # link FAILS OUTRIGHT inside libstdc++ 14's own random.tcc, on a
    # -Wmaybe-uninitialized false positive that -Werror makes fatal. The failure
    # reads as a compiler bug rather than as missing configuration.
    #
    # It must be APPENDED after the project's flags -- GCC resolves conflicting
    # options last-wins and CDDA sets a global -Werror, so a leading exemption is
    # re-armed. It CANNOT go through `make OTHERS=` or `LTOFLAGS=`: a
    # command-line assignment REPLACES those variables rather than appending, and
    # they carry -std=c++17 / -fsigned-char and -Wodr respectively. Overriding
    # LTOFLAGS would SILENTLY DISABLE THE ODR CHECK while this job kept passing.
    #
    # Created inline rather than committed to build-scripts/ or baked into the
    # image: exactly one job needs it, so a shared file buys no reuse, and baking
    # would hide a -Werror exemption behind a compiler name -- the same class of
    # trap as the LTOFLAGS override.
    - name: create the LTO compiler wrapper
      if: ${{ matrix.lto == 1 }}
      run: |
        set -eu
        printf '#!/bin/sh\nexec g++-14 "$@" -Wno-error=maybe-uninitialized\n' > "$RUNNER_TEMP/gxx"
        chmod +x "$RUNNER_TEMP/gxx"
        echo "COMPILER=$RUNNER_TEMP/gxx" >> "$GITHUB_ENV"

    - name: build
      run: bash ./build-scripts/gha_compile_only.sh

    # ccache STATS ONLY -- no `-M`, no `-c`, no `-C`. Trimming or cleaning a
    # directory discarded with the container is pure cost. Stats are kept as the
    # cheapest proof ccache functions at all, and because the SIZE they report is
    # what would size any future cache: measured peaks CMake 0.83 G, clang-21
    # Tiles 1.9 G, ASan 2.24 G, MinGW 4.02 G, g++-11 4.23 G, g++-14 LTO 5.7 G.
    # Upstream's `clear ccache on PRs` step went with the rest -- it stopped PR
    # branches polluting a shared cache that, here, does not exist.
    - name: ccache stats
      if: ${{ !failure() }}
      run: ccache --show-stats --verbose

    # FIVE OF EIGHT JOBS RUN A SUITE, each for a reason the others do not share:
    # sanitizers are useless without execution; the MinGW job is the only way to
    # catch Windows-specific runtime faults; g++-14 Curses is the measured full
    # run on a modern stdlib; the CMake job runs a NARROW spec purely to keep
    # that branch of the test script from being dead code; and the release job
    # runs the suite against what we would actually ship. The suite is 71% of a
    # job's runtime, which is why this is per-job rather than universal.
    #
    # ODR is checked at LINK time and needs no suite -- g++-14 Curses runs one
    # anyway as the only place a modern stdlib's RUNTIME behaviour is exercised,
    # and g++-14 Tiles runs none at all.
    - name: run tests
      if: ${{ matrix.run_tests == 1 }}
      run: bash ./build-scripts/gha_test_only.sh

    # LAUNCH THE GAME BINARY. Distinct from every other check here: linking
    # proves symbols resolve, and the test binary is a DIFFERENT executable that
    # merely shares the sources. Nothing else in this matrix starts `cataclysm`
    # itself, so a fault in main(), option handling or data-path resolution would
    # ship green.
    #
    # The binary is PROBED, not named: the Makefile builds `cataclysm` for Curses
    # and `cataclysm-tiles` for Tiles (Makefile 151-152) and this step serves one
    # job of each. Same reasoning as the .exe probe in gha_test_only.sh -- detect
    # what was produced rather than re-derive it from the flags that produced it.
    - name: launch the game binary
      if: ${{ matrix.launch == 1 }}
      run: |
        set -eu
        game=
        for candidate in ./cataclysm-tiles ./cataclysm; do
          if [ -x "$candidate" ]; then game="$candidate"; break; fi
        done
        [ -n "$game" ] || { echo "FATAL: no game binary found to launch"; exit 1; }
        echo "launching $game"
        # EVERY INVOCATION IS TIME-BOUNDED. `--check-mods` on a Curses build with
        # no TTY hangs rather than fails (see the g++-11 variant's note), and
        # measured 2026-08-21 it consumed the whole 120-minute timeout before
        # anyone learned anything. A step that can hang must carry its own bound.
        # 124 = timed out, and the message says so rather than leaving a bare
        # exit code to interpret.
        run_bounded() {
          if timeout "$1" "${@:2}"; then return 0; fi
          rc=$?
          [ "$rc" = 124 ] && echo "FATAL: '${*:2}' exceeded $1 and was killed -- it HUNG, it did not fail"
          return "$rc"
        }
        run_bounded 60 "$game" --version
        # `dda` IS MANDATORY. --check-mods declares a minimum argument count of 1
        # (main.cpp:331) even though its help text reads "[mod…]", so a bare
        # `--check-mods` exits 1 with "Missing expected argument to command line
        # parameter --check-mods" -- measured 2026-08-21, it failed this job.
        # `dda` is the core content id (game.cpp:320's MOD_INFORMATION_dda).
        #
        # This is a real data gate, not a smoke test: main.cpp:810 exits non-zero
        # if check_mod_data fails OR if any debugmsg was observed while loading.
        #
        # THE DEBUG LOG MUST SURVIVE OR THIS STEP REPORTS A VERDICT WITH NO
        # EVIDENCE. --check-mods sets test_mode (main.cpp:334), which CAPTURES
        # debugmsg output instead of printing it, so the failure path emits only
        # "Checking mod ..." and exit 1 -- measured 2026-08-21, a red step with
        # nothing to act on. check_mod_data reports its own failures to stderr;
        # anything silent came from a debugmsg, and the log is where it lives.
        #
        # `mkdir -p config` IS LOAD-BEARING, not tidiness. DebugOutput::file
        # (main.cpp:720) opens config_dir + "debug.log" (path_info.cpp:272 --
        # config_dir defaults to user_dir + "config/") with a plain ofstream. If
        # that directory is absent the open FAILS SILENTLY: every debugmsg is
        # discarded, nothing raises, and `debug_has_error_been_observed()` is
        # still true -- so the job exits 1 having emitted no evidence at all.
        # Measured 2026-08-21: a whole-container search for any *.log written in
        # the previous ten minutes returned nothing.
        #
        # GATED ON check_mods, NOT launch: the Curses job launches but must never
        # reach here.
        if [ "${{ matrix.check_mods }}" = "1" ]; then
          mkdir -p config
          # No log dump here: the post-mortem step at the end of this job dumps
          # every *.log in the workspace on ANY failure, so one mechanism covers
          # this and every other step.
          run_bounded 900 "$game" --check-mods dda
        fi

    # PACKAGING. A tree can compile and pass its suite and still fail to package
    # -- a data file missing from BINDIST_EXTRAS, a path that only resolves in the
    # source tree -- and no other job would notice, because no other job packages.
    - name: build the distributable
      if: ${{ matrix.bindist == 1 }}
      run: |
        set -eu
        # VERSION.txt IS AN UNDECLARED PREREQUISITE OF `make bindist`: it is in
        # BINDIST_EXTRAS (Makefile:527) but NOTHING in the Makefile builds it, so
        # bindist dies "No rule to make target 'VERSION.txt'" -- measured
        # 2026-08-21, the first time bindist was ever run here. release.yml and
        # CMakeLists.txt each generate it, and `.gitignore:249` ignores it, which
        # also means `forgejo-runner exec` never delivers a local copy. The
        # Makefile packaging path is self-contained only when a workflow supplies
        # this file, so this job supplies it.
        cat > VERSION.txt <<EOL
        build type: ${{ matrix.id }}
        build number: ${{ github.run_number }}
        commit sha: ${{ github.sha }}
        commit ref: ${{ github.ref_name }}
        EOL
        make bindist
        ls -l cataclysmdda-*.tar.gz

    # The one artifact produced by a SUCCESSFUL run. Everything else uploaded here
    # is failure wreckage; this is the candidate itself.
    - name: upload the distributable
      if: ${{ matrix.bindist == 1 && success() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: cataclysmdda-${{ matrix.id }}
        path: cataclysmdda-*.tar.gz

    # WHATEVER FAILED, SAY WHY. stdout is the ONLY channel that survives into a
    # run log -- everything else in the container dies with it -- so evidence
    # sitting in a file is evidence lost. Measured 2026-08-21: `--check-mods`
    # exited 1 having written its diagnostics nowhere, and a search of the whole
    # container for any *.log touched in the previous ten minutes returned
    # nothing. A red job with no evidence reads as a mysterious tree defect and
    # costs a full rebuild per hypothesis to chase.
    #
    # Deliberately a CATCH-ALL rather than per-step: it fires on any step's
    # failure, including ones added later that nobody remembers to instrument.
    #
    # IT MUST NOT BE ABLE TO FAIL. `set +e` and a final `exit 0` -- a post-mortem
    # that breaks the job it is diagnosing, or masks the real failure with its
    # own, is worse than none.
    - name: post-mortem on failure
      if: failure()
      run: |
        set +e
        echo "=== POST-MORTEM: logs written inside the workspace ==="
        # NUL-delimited, and fed by process substitution rather than a pipe: a
        # `find | while` pipeline runs the loop in a SUBSHELL, so `found=1` would
        # not survive it and an empty workspace and a full one would look alike.
        found=0
        while IFS= read -r -d '' f; do
          found=1
          echo "--- $f ($(wc -l < "$f" 2>/dev/null) lines, tail 300)"
          tail -300 "$f" 2>/dev/null
        done < <(find . -maxdepth 4 -name '*.log' -print0 2>/dev/null | head -z -n 20)
        if [ "$found" = 0 ]; then
          echo "(no *.log in the workspace -- if a step failed silently, its"
          echo "diagnostics were discarded rather than written; check that the"
          echo "process had a writable log directory)"
        fi
        echo "=== END POST-MORTEM ==="
        exit 0

    # Retained on failure so a red run can be investigated without re-running the
    # matrix, which costs hours on a single serialized runner.
    - name: upload test binary if failed
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: cata_test-${{ matrix.id }}
        path: tests/cata_test*
        if-no-files-found: ignore
        retention-days: 9
