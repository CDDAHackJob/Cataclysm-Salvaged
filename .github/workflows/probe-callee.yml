name: "PROBE callee - reusable workflow target"

# THROWAWAY, half of a pair. See probe-caller.yml for why this exists and how to
# read the output. Delete both once the answers are in SLVG_CI_PLAN.md 11.9b.
#
# This mirrors what release.yml actually does, so that a pass here transfers:
#   - it is reached ONLY via `uses:` from another workflow (workflow_call)
#   - it takes `with:` inputs
#   - it does NO checkout (release.yml deliberately skips it)
#   - it downloads with NO `name:` filter, receiving every artifact of the run
#     into a per-artifact subdirectory -- exactly release.yml's pattern
#
# If any of those diverge from release.yml later, re-run the probe or stop
# trusting it.

on:
  # workflow_call ONLY. There is nothing to verify outside a run that produced the
  # artifact, and a dispatch entry here would create a job that "passes" having
  # measured nothing.
  workflow_call:
    inputs:
      passed_text:
        required: false
        type: string
        default: ""
      # BOOLEAN, matching what the caller passes. Typing it string and passing a
      # boolean risks a coercion error that would masquerade as a workflow_call
      # failure -- the exact thing this probe exists to measure.
      passed_flag:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: slvg-ci
    timeout-minutes: 10
    steps:
      - name: confirm this workflow was reached at all
        run: |
          set -eu
          echo "PROBE 4 PASS : server resolved 'jobs.<id>.uses' -- workflow_call WORKS"
          echo "PROBE 4 INFO : event=${{ github.event_name }} run=${{ github.run_number }}"

      - name: confirm 'with:' inputs crossed the boundary
        run: |
          set -eu
          got_text='${{ inputs.passed_text }}'
          got_flag='${{ inputs.passed_flag }}'
          echo "PROBE 5 RAW  : passed_text=[$got_text] passed_flag=[$got_flag]"
          if [ -z "$got_text" ]; then
            echo "PROBE 5 FAIL : 'with:' input arrived EMPTY across the workflow_call boundary"
            exit 1
          fi
          echo "PROBE 5 PASS : 'with:' inputs cross the workflow_call boundary"

      # release.yml downloads with no `name:`, taking every artifact of the run
      # into staged/<artifact-name>/. Same call, same pin.
      - name: download every artifact of this run
        # v3.1.0-node20 -- must stay identical to release.yml's pin, or this probe
        # stops proving anything about the real path.
        uses: actions/download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b # v3.1.0-node20
        with:
          path: staged

      - name: verify the artifact survived the round trip
        run: |
          set -eu
          echo "--- what arrived ---"
          find staged -type f -printf '  %M %s %p\n' 2>/dev/null || find staged -type f -exec ls -l {} \;

          f="staged/probe-artifact/marker.txt"
          if [ ! -f "$f" ]; then
            echo "PROBE 6 FAIL : artifact did not survive upload->download across workflow_call"
            echo "  expected $f ; tree above shows what actually arrived"
            exit 1
          fi

          # Byte fidelity, not mere presence.
          if ! grep -q '^marker=PROBE-PAYLOAD-OK$' "$f"; then
            echo "PROBE 6 FAIL : marker file arrived but its CONTENT is wrong"
            cat "$f"
            exit 1
          fi
          echo "PROBE 6 PASS : artifact round trip works, content intact"

          # Mode preservation. The Linux release ships `cataclysm-launcher`, which
          # must stay executable; whether the artifact system preserves that is
          # untested. NOT fatal -- release.yml repacks from a tar.gz whose modes
          # are carried internally, so a loss here would be informational. Record
          # it rather than guess.
          x="staged/probe-artifact/probe-exec.sh"
          if [ -x "$x" ]; then
            echo "PROBE 7 PASS : executable bit SURVIVED the artifact round trip"
          else
            echo "PROBE 7 INFO : executable bit LOST in the artifact round trip (mode $( stat -c '%a' "$x" 2>/dev/null || echo '?' ))"
            echo "  Not fatal for releases: bindist archives carry modes internally."
          fi

      - name: summary
        run: |
          set -eu
          echo "================ PROBE COMPLETE ================"
          echo "Reaching this line means, on REAL infrastructure:"
          echo "  - workflow_dispatch inputs arrive and evaluate in an if:  (1,2)"
          echo "  - workflow_call resolves server-side                      (4)"
          echo "  - with: inputs cross the boundary                         (5)"
          echo "  - artifacts round-trip with content intact                (6)"
          echo "Check the PROBE 7 line for executable-bit behaviour."
          echo "Record these in SLVG_CI_PLAN.md 11.9b, then DELETE both probe-*.yml."
