name: "PROBE - dispatch inputs, workflow_call, artifacts"

# THROWAWAY. Delete both probe-*.yml once the three answers are recorded in
# SLVG_CI_PLAN.md 11.9b. This exists because `forgejo-runner exec` structurally
# cannot test what it tests: exec has NO `--input` flag, NO artifact server, and
# does its own job planning with no server involved. So three mechanisms the
# release path depends on have never executed anywhere:
#
#   1. a workflow_dispatch INPUT reaching the job (and evaluating in an `if:`)
#   2. the artifact upload/download ROUND TRIP
#   3. server-side `jobs.<id>.uses` -- i.e. workflow_call at all
#
# Discovering any of those broken during a real release costs hours, because the
# packaging step runs LAST, after nine serialized build jobs. This runs in about a
# minute and answers all three.
#
# SAFE BY CONSTRUCTION: dispatch-only, no checkout, no credentials, no network,
# no writes outside the job container. It builds nothing and publishes nothing.
#
# ACTION PINS ARE DELIBERATELY THE SAME SHAs matrix.yml and release.yml use. A
# probe that passes on a different version of the artifact actions would prove
# nothing about the real path.
#
# HOW TO READ IT: every finding prints as `PROBE <N> <RESULT>: ...`. Job summary
# at the end of the callee. Anything not printing a PROBE line is itself a finding.

on:
  # No other trigger. If this file ever fires on a push or PR, that is a defect.
  workflow_dispatch:
    inputs:
      # BOOLEAN, because that is the type `matrix.yml`'s real `release` input uses
      # and booleans are where dispatch inputs most often surprise -- a forge may
      # deliver the STRING "false", which is truthy in some expression engines.
      flag:
        description: "Set true to prove a boolean input arrives and gates a step"
        type: boolean
        default: false
      # STRING, to prove a value survives the workflow_call boundary intact.
      text:
        description: "Any text; the called workflow must echo it back unchanged"
        type: string
        default: "hello-from-dispatch"

concurrency:
  group: probe-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  produce:
    name: probe A - inputs and artifact upload
    runs-on: slvg-ci
    timeout-minutes: 10
    steps:
      - name: report what the dispatch actually delivered
        run: |
          set -eu
          echo "PROBE 1 INFO: event=${{ github.event_name }} ref=${{ github.ref_name }} sha=${{ github.sha }}"
          # Print the RAW value and its type-ish shape. `matrix.yml` gates packaging
          # on `inputs.release`, so how a boolean arrives here is load-bearing.
          echo "PROBE 1 RAW  : inputs.flag=[${{ inputs.flag }}] inputs.text=[${{ inputs.text }}]"
          if [ -z "${{ inputs.text }}" ]; then
            echo "PROBE 1 FAIL : string input arrived EMPTY -- dispatch inputs are not reaching the job"
            exit 1
          fi
          echo "PROBE 1 PASS : dispatch inputs reach a run: step"

      # THE ONE THAT MATTERS MOST. matrix.yml gates the whole packaging job on
      # exactly this shape. If the expression engine mishandles the boolean, a
      # release either never packages or packages on every dispatch.
      - name: step gated on the boolean being TRUE
        if: ${{ inputs.flag }}
        run: |
          echo "PROBE 2 PASS : 'if: inputs.flag' evaluated TRUE -- dispatched with flag=true"

      - name: step gated on the boolean being FALSE
        if: ${{ ! inputs.flag }}
        run: |
          echo "PROBE 2 PASS : '! inputs.flag' evaluated TRUE -- dispatched with flag=false"

      - name: build a marker file to send through the artifact system
        run: |
          set -eu
          mkdir -p out
          # A known, exact payload so the callee can prove byte fidelity rather
          # than merely that a file arrived.
          printf 'marker=%s\nrun=%s\nsha=%s\n' "PROBE-PAYLOAD-OK" "${{ github.run_number }}" "${{ github.sha }}" > out/marker.txt
          # An executable, because the release path carries `cataclysm-launcher`
          # and mode preservation through upload/download is untested here.
          printf '#!/bin/sh\necho executable-survived\n' > out/probe-exec.sh
          chmod 755 out/probe-exec.sh
          echo "PROBE 3 INFO: staged $( find out -type f | wc -l ) files"
          ls -l out

      - name: upload the artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: probe-artifact
          path: out/*
          if-no-files-found: error
          retention-days: 1

  # PROBE 4: server-side `jobs.<id>.uses`. If Forgejo cannot resolve a reusable
  # workflow, this job errors or never appears -- and that is the answer, because
  # release.yml is invoked exactly this way. The documented fallback is to inline
  # release.yml's steps into matrix.yml as a normal job.
  consume:
    name: probe B - workflow_call and artifact download
    needs: produce
    uses: ./.github/workflows/probe-callee.yml
    with:
      passed_text: ${{ inputs.text }}
      # Deliberately stringified: workflow_call inputs are typed, and passing a
      # boolean through as a string is the conservative form. If the real
      # release.yml ever needs a boolean across this boundary, test that too.
      passed_flag: ${{ inputs.flag && 'true' || 'false' }}
