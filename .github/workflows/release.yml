name: "Package release artifacts"

# HackJob's Summary:
# Workflow rebuilt and tested extensively with Claude Opus.
# Its comments are condensed into "caveman" claude and may be a bit confusing.
# Some sections will be referring to items within a plan document not in the repo.
# These are notes for myself and Claude.
# This file no longer builds or publishes anything -- it only PACKAGES what
# matrix.yml already built and tested. See below for why.
# ~HackJob
#
# WHAT THIS IS: the last step of a release run. matrix.yml builds and tests, then
# calls this file to turn its three `bindist` outputs into three uniformly named,
# uniformly structured .zip files. The operator downloads one artifact and
# attaches its contents to a GitHub Release BY HAND.
#
# WHAT THIS IS NOT, AND THE WHOLE FILE DEPENDS ON IT: it does not build, it does
# not publish, and it holds no credential. The previous version of this file was
# upstream's: a 13-entry build matrix ending in `gh release create --prerelease`
# under `permissions: write-all`. EVERY ONE of those 13 entries was dead -- 7
# named retired runner images (windows-2019, ubuntu-20.04, macos-12), 5 targeted
# platform directories this tree no longer has (android/, build/osx), and the
# WebAssembly entry was dropped outright (SLVG_CI_PLAN.md 11.8). None of it was
# repairable, so none of it was repaired.
#
# WHY PACKAGING LIVES HERE AND BUILDING DOES NOT (11.9a, "Option A"): releases are
# built on the NAS and attached to GitHub by hand, so no GitHub-side job can reach
# the artifacts and no credential ever lands on this box. Packaging is therefore
# the only release work a workflow can usefully do.
#
# WHY IT IS CALLED BY matrix.yml RATHER THAN RUN ON ITS OWN. The obvious design --
# a manual workflow that finds the last successful matrix run and downloads its
# artifacts -- CANNOT WORK ON THIS FORGEJO. Measured 2026-09-05 against
# swagger.v1.json on the live instance (15.0.6): listing runs works
# (`GET /repos/{owner}/{repo}/actions/runs`, with status/workflow_id/ref filters),
# but ALL THREE artifact endpoints are ABSENT -- /actions/runs/{id}/artifacts,
# /actions/artifacts, /actions/artifacts/{id}/zip. The only artifact paths in the
# entire API are org and user quota counters. `actions/download-artifact` is no
# substitute: inside a job it talks to the runner's artifact endpoint, which is
# scoped to the CURRENT run by design. Same-run artifacts need no API at all,
# which is why this is a `workflow_call`.
#
# UNPROVEN, AND THE FALLBACK IF IT BITES: `workflow_call` is verified only through
# `forgejo-runner exec` (reusable workflow resolves, `with:` inputs arrive,
# `needs:` ordering holds). exec does its OWN job planning with no server, while
# the live path has Forgejo's server parse `jobs.<id>.uses`. If the server cannot,
# fold these steps into matrix.yml as a plain `package` job with the identical
# gates -- the logic is unchanged, only the file boundary is lost.

on:
  # NO other trigger, deliberately. There is nothing to package outside a run that
  # just built something, and a `workflow_dispatch` here would produce an empty
  # job that looks like it worked. The gating lives in the CALLER (matrix.yml):
  # release runs are dispatch-only and require every matrix leg green.
  workflow_call:
    inputs:
      # Passed through purely so the packaged filenames can carry it. Not read
      # from the tree, because this job deliberately does not check the tree out.
      run_number:
        required: false
        type: string
        default: ""

concurrency:
  group: package-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: package release artifacts
    runs-on: slvg-ci

    # No compilation happens here -- this is unpack, repack, upload over ~400 MB.
    # The bound exists to cap a hang, not because the work is slow.
    timeout-minutes: 30

    steps:
      # NO CHECKOUT, deliberately. Nothing here reads the source tree: the inputs
      # are artifacts and the tools are in the image. Skipping it avoids a clone
      # of a 12 GB repository to rename three files.

      - name: fetch every artifact this run produced
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          path: staged

      # WHAT ARRIVES, AND WHY THE FAILURE ARTIFACTS ARE NOT A PROBLEM. Downloading
      # with no `name:` fetches ALL artifacts into staged/<artifact-name>/. On a
      # green run that is exactly the three bindist uploads -- every other upload
      # in matrix.yml is `if: failure()`, so on the only runs that reach this job
      # they do not exist. The loop below keys off an explicit id list rather than
      # a glob, so an unexpected extra artifact is ignored rather than shipped.
      - name: repackage into uniform, uniquely named zips
        id: repack
        run: |
          set -euo pipefail

          # THE ID -> PLAYER-FACING NAME MAP. Upstream moved off developer
          # vocabulary and the names are much better for it: a player downloading
          # a game should not have to know what "curses" or "tiles" means.
          # Left column is matrix.yml's `id:`; right is what ships.
          map_windows_graphics_sounds="windows-with-graphics-and-sounds-x64"
          map_linux_graphics_sounds="linux-with-graphics-and-sounds-x64"
          map_linux_terminal="linux-terminal-only-x64"

          declare -A VARIANT=(
            [debian-mingw-gcc-12]="$map_windows_graphics_sounds"
            [debian-gcc-12-release]="$map_linux_graphics_sounds"
            [debian-gcc-12-curses-release]="$map_linux_terminal"
          )

          mkdir -p out work

          for id in "${!VARIANT[@]}"; do
            variant="${VARIANT[$id]}"
            src_dir="staged/cataclysm-slvg-${id}"

            # A MISSING ARTIFACT IS A HARD FAILURE, NOT A SKIP. Reaching this job
            # at all means every matrix leg went green, so a bindist output that
            # is not here means the upload silently produced nothing -- exactly
            # the case where a "package what we found" loop would publish a
            # two-file release and look successful.
            if [ ! -d "$src_dir" ]; then
              echo "FATAL: no artifact directory for '$id' at $src_dir"
              echo "  present:"; ls -1 staged 2>/dev/null | sed 's/^/    /'
              exit 1
            fi

            archive="$( find "$src_dir" -maxdepth 1 -type f \
                          \( -name 'cataclysm-slvg-*.tar.gz' -o -name 'cataclysm-slvg-*.zip' \) \
                          | head -1 )"
            [ -n "$archive" ] || { echo "FATAL: no bindist archive inside $src_dir"; ls -lR "$src_dir"; exit 1; }

            # VERSION COMES FROM THE FILENAME, not from the tree. `make bindist`
            # emits cataclysm-slvg-<VERSION>.<ext> -- BUILD_PREFIX is empty here
            # because AUTO_BUILD_PREFIX is never set in CI (verified 2026-09-05;
            # it is `ifdef`-guarded at Makefile:288), so the name is already clean
            # and the version is the only variable part.
            base="$( basename "$archive" )"
            version="$( echo "$base" | sed -E 's/^cataclysm-slvg-(.+)\.(tar\.gz|zip)$/\1/' )"
            [ -n "$version" ] && [ "$version" != "$base" ] \
              || { echo "FATAL: could not read version out of '$base'"; exit 1; }

            # ALL THREE MUST AGREE. They come from one matrix run so they always
            # should -- which is exactly why a disagreement means something is
            # wrong upstream of here (a stale artifact, a re-run mixing two runs)
            # and must not be quietly resolved by whichever loop iteration ran
            # last. Bash associative-array order is unspecified, so without this
            # the "winner" would not even be predictable.
            if [ -z "${VERSION_SEEN:-}" ]; then
              VERSION_SEEN="$version"
            elif [ "$version" != "$VERSION_SEEN" ]; then
              echo "FATAL: artifacts disagree on version -- '$VERSION_SEEN' vs '$version' (from $base)"
              exit 1
            fi

            name="cataclysm-slvg-${version}-${variant}"
            rm -rf "work/$name" && mkdir -p "work/$name"

            # NORMALISE THE INTERNAL LAYOUT -- the two formats disagree, and one of
            # them is a trap. BINDIST_CMD tars with
            # `--transform=s@^$(BINDIST_DIR)@cataclysm-slvg-$(VERSION)@`, so the
            # tarball has a top-level directory. W32BINDIST_CMD does
            # `cd $(BINDIST_DIR) && 7zz a ../x.zip *`, which has NONE: extracting
            # the Windows zip scatters ~7,000 files into whatever directory the
            # player is sitting in. Both are unpacked flat here and re-rooted
            # under one directory named for the artifact, so all three behave the
            # same and two of them cannot collide on extraction.
            case "$archive" in
              *.tar.gz) tar -xzf "$archive" -C "work/$name" --strip-components=1 ;;
              *.zip)    7zz x -bso0 -bsp0 -o"work/$name" "$archive" >/dev/null ;;
            esac

            # 7-Zip's zip, -mx=9 deflate. NOT -t7z and NOT zip-with-LZMA:
            # .7z is smaller (63.0 vs 74.1 MB measured) but is non-native on BOTH
            # target platforms -- Win10 needs 7-Zip installed, most Linux desktops
            # need p7zip -- and LZMA inside a .zip (method 14) cannot be read by
            # Explorer or Info-ZIP `unzip`, which forfeits the exact property zip
            # was chosen for. Deflate is the only setting that opens everywhere
            # with no extra install (11.9b).
            ( cd work && 7zz a -tzip -mx=9 -bso0 -bsp0 "../out/${name}.zip" "$name" >/dev/null )
            echo "packaged ${name}.zip"
          done

          echo "version=${VERSION_SEEN}" >> "$GITHUB_OUTPUT"
          echo
          echo "=== release artifacts ==="
          ls -lh out | tail -n +2

          # THREE, ALWAYS. A release missing a platform should fail here rather
          # than be noticed after publication.
          n="$( find out -maxdepth 1 -name '*.zip' | wc -l )"
          [ "$n" -eq 3 ] || { echo "FATAL: expected 3 artifacts, produced $n"; exit 1; }

      # ONE ARTIFACT CONTAINING ALL THREE, not three artifacts. The forge zips
      # every artifact on download, so a .zip uploaded alone arrives as a .zip
      # inside a .zip. Bundling means the operator downloads once and unpacks once
      # to get three files ready to attach, instead of repeating that three times.
      - name: upload the release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RELEASE-cataclysm-slvg-${{ steps.repack.outputs.version }}-${{ inputs.run_number }}
          path: out/*.zip
          if-no-files-found: error
          # Long enough that a release is not lost to expiry while it is being
          # written up, short enough that these do not accumulate on the pool.
          retention-days: 30
