name: Summary Labeler

# HackJob's Summary:
# Workflow rebuilt and tested extensively with Claude Opus.
# Its comments are condensed into "caveman" claude and may be a bit confusing.
# Some sections will be referring to items within a plan document not in the repo.
# These are notes for myself and Claude.
# To summarize the rewrite, we pinned the version and minimized relying on external sources.
# Fixed a small issue where it was built for upstream with way bigger issue numbers.
# ~HackJob
#
# Labels a pull request by WHAT KIND of change it is, read from the PR body --
# where labeler.yml labels by WHAT AREA the changed files touch. The input is the
# one line the PR template asks for:
#
#     #### Summary
#     Category "Brief description"
#
# so `Bugfixes "..."` becomes <Bugfix>, `Content "..."` becomes <Content>, and so
# on, per .github/summary-labels.yml.
#
# COUPLED TO THE CHANGELOG, indirectly and easy to break.
# tools/generate_changelog.py parses that SAME line independently, validating it
# against its own VALID_SUMMARY_CATEGORIES. Neither reads the other, so
# .github/pull_request_template.md is load-bearing for both: change the heading
# or the quoting and this stops labelling while the changelog stops recording,
# both silently. Edit the category list in all three places (2.6).
#
# Unlike labeler.yml, worth having per-PR AND per-release: on a release
# aggregating months of work it records the MIX of change kinds, closer to a
# changelog summary than area labels are.

on:
  # No paths: filter -- the trigger is the PR body, not the files. No
  # workflow_dispatch: there is no body to read without a pull request.
  #
  # pull_request_target IS LOAD-BEARING FOR MORE THAN THE TOKEN. getConfig()
  # reads .github/summary-labels.yml through the API at `github.context.sha`, and
  # under this trigger that SHA is the BASE branch, not the PR head -- so a PR
  # cannot ship its own label rules and have them honoured. `pull_request` would
  # read the config FROM the PR, letting an author choose their own labels. As
  # with labeler.yml, no PR code is checked out or executed.
  - pull_request_target

concurrency:
  group: summary-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  label:
    name: labeler

    # ADDED -- upstream had no permissions block at either level. Not merely
    # untidy: with the repo default read-only (6.2) an absent block means no write
    # scope, and the action fails to apply labels for a reason that looks nothing
    # like permissions.
    #
    # No `statuses: write`, deliberately. multi-labeler posts commit statuses only
    # from a `checks:` section, and summary-labels.yml has none -- addChecks()
    # returns early on an empty list. Add a checks: block and this needs
    # statuses: write, or labels apply while the status silently fails.
    permissions:
      contents: read        # repos.getContent, to fetch the config
      pull-requests: write  # issues.addLabels, to apply them

    runs-on: cdda-ci

    # Two API calls plus regex over one PR body -- getContent for the config,
    # addLabels for the result. Unlike labeler.yml it does NOT page a changed-file
    # list, so cost does not grow with the release. The bound caps a hang.
    timeout-minutes: 10

    steps:
      # NO CHECKOUT STEP, where upstream ran one first. Never needed:
      # multi-labeler fetches its config through the API
      # (`client.rest.repos.getContent`) and touches no file in the workspace --
      # verified by reading v4.0.0's source, which has no filesystem access at
      # all. Dropping it saves a full clone of a 12 GB repo to read one YAML file.
      #
      # PINNED TO v4.0.0, FORCED BY THE RUNNER IMAGE. v5.0.0 declares
      # `runs: using: node24`; cdda-ci ships node 20.20.2, so v5 cannot execute
      # here. v3.0.0 and v4.0.0 declare node20, and v4.0.0 is the newest that
      # runs -- with the config schema this repo has (`version: t.literal('v1')`
      # with a `body` matcher, checked at the tag).
      #
      # By SHA rather than @v4, and emphatically not @main as upstream had it:
      # `v5` and `v5.0.0` already point at different commits there, so its major
      # tags demonstrably move. Absolute URL because an unqualified `uses:`
      # resolves against code.forgejo.org, which does not carry this action (11.5e).
      - uses: https://github.com/fuxingloh/multi-labeler@b15a54460c38f54043fa75f7b08a0e2aa5b94b5b # v4.0.0
        with:
          # REQUIRED, NOT OPTIONAL: config-path defaults to '.github/labeler.yml'
          # -- the OTHER config, the path-based one. Omit it and the action reads
          # labeler.yml's 64 file-glob rules as body matchers and fails to parse.
          config-path: '.github/summary-labels.yml'
          # github-token deliberately not passed: it defaults to
          # `${{ github.token }}`, and a default applies only to an ABSENT input,
          # so an empty string would win and leave the action with no credential.
          # Same reasoning as labeler.yml; whether this forge populates
          # secrets.GITHUB_TOKEN is unmeasured and untestable locally, since
          # `forgejo-runner exec` mints no token.
