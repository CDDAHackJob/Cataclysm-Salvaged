name: Modern toolchain syntax check

# HackJob's Summary:
# Workflow built/rebuilt and tested extensively with Claude Opus.
# Its comments are condensed into "caveman" claude and may be a bit confusing.
# Some sections will be referring to items within a plan document not in the repo.
# These are notes for myself and Claude.
# This just runs a gcc 16 syntax check.
# Reliance on outside dependencies has been minimized.
# ~HackJob
#
# CHEAP INSURANCE AGAINST TOOLCHAIN DRIFT, not a code-quality check.
#
# Measured 2026-08-18 (CDDA_TOOLCHAIN_PLAN.md step 1): 606 of 606 translation
# units compile clean under GCC 16 trunk, and the same 606 under Clang 21 once
# two math_parser fixes landed. That is a SNAPSHOT, and without a guard it
# silently expires -- every commit written and checked only against GCC 12 can
# add breakage that nothing detects until someone attempts a bump, by which point
# it is archaeology across many commits instead of two lines.
#
# WHAT THIS IS NOT: it does not run clang-tidy, does not build the CataAnalyzer
# plugin, needs no llvm-N-dev, and produces no binary. It answers exactly one
# question -- "does this tree still compile under a modern toolchain?" That is
# why it can use a compiler clang-tidy.yml cannot: clang-tidy stays pinned to
# LLVM 17 because the plugin does not build past it (CDDA_TOOLCHAIN_PLAN.md 1.1),
# and this file loads no plugin.
#
# `-fsyntax-only` is what makes it affordable: no codegen, no optimisation, no
# link. Measured 197 s for 606 TUs under GCC 16 at -P6, against ~90 min for a
# whole-tree clang-tidy run. This job runs -P4 for heat (see the check step), so
# the real figure is somewhat higher and has not been re-measured.
#
# ONE VARIANT:
#
#   GCC 16   / Ubuntu      trunk compiler against a NEW standard library --
#                          early warning for Arch and Fedora users
#
# It is the only compiler in use that matrix.yml does not already BUILD, which is
# the whole test for belonging here: a syntax-only pass over a toolchain that is
# also compiled and linked elsewhere is strictly weaker duplicate work.
#
# This is the syntax-only job of CDDA_CI_PLAN.md 11.11, and it lives here rather
# than in matrix.yml because the technique is the same one already implemented
# here -- replay compile_commands.json with codegen stripped -- while the gha_*
# scripts matrix.yml drives have no syntax-only path at all. Putting it there
# would have meant a second, divergent implementation.
#
# IT BUILDS WITH TILES=1 SOUND=1, deliberately. 12,673 lines of the tree sit
# inside TILES/SDL_SOUND preprocessor guards, and a Curses-only configuration
# reports them as unanalysed rather than clean -- the gap that made the original
# Curses-only Ubuntu image a defect (11.11). Under -fsyntax-only the extra
# coverage is nearly free: no linking, so SDL2 headers suffice and no libraries
# are needed at run time.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.hpp'
      - '**/CMakeLists.txt'
      - 'CMakeModules/**'
      - '**/Makefile'
      - '.github/workflows/syntax-check.yml'

  # Pull requests here happen only at release (experimental -> master), so without
  # dispatch the first time a modern toolchain sees a change is months after it
  # was written -- the same reasoning that put workflow_dispatch on clang-tidy.yml.
  workflow_dispatch:

concurrency:
  group: syntax-check-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}

    name: ${{ matrix.title }}
    runs-on: ${{ matrix.host }}

    strategy:
      # One variant today, but kept false: the moment a second is added, stopping
      # at the first failure would answer the question for one toolchain and hide
      # the other.
      fail-fast: false
      max-parallel: 1

      matrix:
        include:
          # ONE VARIANT, DELIBERATELY. A Clang 21 / Debian / libstdc++ 12 variant
          # was REMOVED 2026-08-21 as duplicate work -- the matrix's Debian Clang
          # job is that exact pairing and BUILDS it, where this file only reaches
          # -fsyntax-only. THE RULE IT LEAVES BEHIND: a variant earns a place here
          # only if the matrix does not already build that compiler, which of the
          # compilers in use is true of g++-16 alone. Clang against a MODERN
          # libstdc++ is a different pairing and is not covered here either; the
          # matrix's Ubuntu Clang job builds it.

          # GCC 16 is a TRUNK SNAPSHOT, baked into cdda-ci-ubuntu from
          # ubuntu-toolchain-r/test. It self-reports as
          # "16.0.1 20260315 (experimental) [trunk r16-8100-...]".
          #
          # -Werror IS STRIPPED FOR THIS VARIANT ONLY, and that is what makes a
          # trunk compiler safe to GATE on. Measured against real GCC 16:
          #
          #                                              -Werror   stripped
          #   missing transitive include                  fails     FAILS
          #   ("error: 'uint64_t' does not name a type")
          #   ordinary warning (unused variable)          fails     passes
          #
          # The entire reason this variant exists produces HARD ERRORS, not
          # warnings: a newer libstdc++ dropping a transitive include yields
          # "does not name a type", which still fails with -Werror gone. What
          # disappears is exactly the noise a trunk compiler is untrustworthy
          # about -- new, experimental or restyled warnings. So it keeps 100% of
          # its signal and sheds the flakiness that would otherwise force it to
          # be advisory.
          #
          # THE PRINCIPLE, for any future trunk compiler: -Werror is trustworthy
          # on a RELEASE compiler and not on trunk. A release variant would keep
          # it with targeted exceptions; only a trunk one strips it wholesale.
          - title: GCC 16 trunk, Ubuntu, libstdc++ 16
            host: cdda-ci-ubuntu
            compiler: g++-16
            strip_werror: 1

    # 197 s measured at -P6; this job runs -P4, so somewhat longer. 30 minutes is
    # ~9x the measured figure and this job has no reason to approach it, so
    # hitting the limit means something is genuinely wrong rather than that the
    # tree grew.
    timeout-minutes: 30

    steps:
    # NO INSTALL STEP: g++-16 is baked into cdda-ci-ubuntu, and syntax checking
    # needs no llvm-N-dev at all. This step only PROVES the compiler this variant
    # claims to test is the one actually present -- cheap, and it turns a
    # mis-tagged image into a clear message rather than a confusing wall of
    # diagnostics from the wrong toolchain.
    - name: report compiler
      run: ${{ matrix.compiler }} --version

    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    # Configure only -- nothing is built. This exists solely to emit
    # compile_commands.json, which carries the real defines and include paths;
    # reconstructing those by hand would test a configuration the project does
    # not use. CATA_CLANG_TIDY_PLUGIN is deliberately OFF so no LLVM dev headers
    # are needed. Measured under 2 s.
    - name: generate compile database
      run: |
        set -eu
        mkdir -p build
        cd build
        cmake \
          -DBACKTRACE=ON \
          -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}" \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_BUILD_TYPE=MinSizeRel \
          -DTILES=1 -DSOUND=1 \
          -DCATA_CLANG_TIDY_PLUGIN=OFF \
          ..

    # The check. Each entry in the compile database is replayed with codegen
    # stripped.
    #
    # THREE TRANSFORMS, EACH LOAD-BEARING:
    #   * `-o <path>` removed -- there is no output file
    #   * `-c` removed -- MANDATORY, not tidiness. Under -fsyntax-only the
    #     compiler reports `-c` as an unused argument, and this project builds
    #     with -Werror, so every TU fails instantly on a command-line warning
    #     without compiling anything. That failure looks exactly like a broken
    #     tree -- measured: the whole database "failed" in about a second.
    #   * `matrix.extra_flags` appended -- an unused hook today, kept so a future
    #     variant can carry a targeted exemption without editing this script.
    #
    # `-Werror` and `-Werror=*` are DROPPED, driven by `strip_werror` on the
    # matrix entry rather than hard-coded here, so a future RELEASE-compiler
    # variant cannot silently inherit a trunk compiler's exemption.
    #
    # -P4 matches the thermal ceiling established for this host: 4 parallel
    # compilers peak at 87 C with zero throttle events, 6 sustains ~90 C with 96
    # (CDDA_CI_PLAN.md 11.5h).
    #
    # tools/clang-tidy-plugin is excluded: it includes clang's own headers, which
    # need llvm-dev, and clang-tidy.yml already builds it.
    - name: syntax-check every translation unit
      env:
        COMPILER_LABEL: ${{ matrix.compiler }}
        EXTRA_FLAGS: ${{ matrix.extra_flags }}
        STRIP_WERROR: ${{ matrix.strip_werror }}
      run: |
        set -eu
        python3 - <<'PY' > "$RUNNER_TEMP/cmds.tsv"
        import json, os, shlex
        strip_werror = os.environ.get('STRIP_WERROR') == '1'
        extra = shlex.split(os.environ.get('EXTRA_FLAGS', ''))
        db = json.load(open('build/compile_commands.json'))
        for e in db:
            if 'third-party' in e['file'] or 'clang-tidy-plugin' in e['file']:
                continue
            out, skip = [], False
            for a in shlex.split(e['command']):
                if skip:
                    skip = False; continue
                if a == '-o':
                    skip = True; continue
                if a == '-c':
                    continue
                if strip_werror and ( a == '-Werror' or a.startswith('-Werror=') ):
                    continue
                out.append(a)
            out[1:1] = ['-fsyntax-only'] + extra
            print('\t'.join([e['directory'], e['file'], shlex.join(out)]))
        PY
        total=$(wc -l < "$RUNNER_TEMP/cmds.tsv")
        echo "Syntax-checking $total translation units with ${COMPILER_LABEL}."
        : > "$RUNNER_TEMP/failed.txt"
        xargs -a "$RUNNER_TEMP/cmds.tsv" -P4 -d'\n' -I LINE bash -c '
          IFS="	" read -r dir file cmd <<< "LINE"
          if ! ( cd "$dir" && eval "$cmd" ); then
            printf "%s\n" "$file" >> "'"$RUNNER_TEMP"'/failed.txt"
          fi'
        n=$(grep -c . "$RUNNER_TEMP/failed.txt" || true)
        # A count of 0 must mean "all checked and clean", never "nothing ran".
        if [ "$total" -eq 0 ]; then
          echo "::error::compile database produced no translation units - the check did not run."
          exit 1
        fi
        if [ "$n" -gt 0 ]; then
          echo "::error::$n of $total translation units fail under ${COMPILER_LABEL}:"
          sed 's/^/  /' "$RUNNER_TEMP/failed.txt"
          exit 1
        fi
        echo "All $total translation units compile under ${COMPILER_LABEL}."

    # The deprecated-declarations rationale moved to matrix.yml's Clang 21 job
    # when this file's Clang variant was removed: the flag lives there now, and
    # the reasoning belongs with the flag rather than in the file that used to
    # carry it. The controlled experiment behind it is CDDA_TOOLCHAIN_PLAN.md 1.2.
