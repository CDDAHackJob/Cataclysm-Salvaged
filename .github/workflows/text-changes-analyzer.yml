name: Text Changes Analyzer

# HackJob's Summary:
# Workflow rebuilt and tested extensively with Claude Opus.
# Its comments are condensed into "caveman" claude and may be a bit confusing.
# Some sections will be referring to items within a plan document not in the repo.
# These are notes for myself and Claude.
# To summarize the rewrite, we pinned the version and minimized relying on external sources.
# ~HackJob
#
# Spell-checks the in-game text a PR CHANGES: generate a .pot on the base commit
# and on the merge commit, diff the two. Diff-based by construction, so it avoids
# the whole-tree baseline problem astyle and json have -- but see the warn-only
# decision at the bottom, a measured consequence of what that scan contains.
#
# TRIGGER. Upstream filtered on '**.json', the same inverted glob
# assign_mission_target_needs_om_special.yml carried: under Forgejo's doublestar
# matcher '**' is recursive only as a whole path component, so '**.json' means
# root-level *.json -- CMakePresets.json and org.cataclysmdda.CataclysmDDA.json.
# update_pot.sh extracts from `data` (extract_json_strings.py -i data), so the
# filter matched two files the extractor never reads and missed all 5,379 it
# does. JSON is most of the translatable text here, so as committed this check
# only ever saw C++ string changes.
#
# src/*.h and src/*.cpp are LEFT SINGLE-STAR deliberately, not the same
# oversight: update_pot.sh runs xgettext on literally `src/*.cpp src/*.h`, so the
# filter already matches the extractor's corpus. Widening to src/**/*.cpp would
# add src/third-party/, which has no translatable strings.
#
# The rest of the list is what upstream omitted -- the tooling that DECIDES the
# verdict: update_pot.sh, unicode_check.py, the three spell_check scripts, and
# tools/spell_checker/** (tokenizer and checker). Change any and the same string
# gets a different answer. Same omission json.yml had, where editing the
# formatter's source never re-ran the formatter.
#
# dictionary.txt IS COVERED FOR A DIFFERENT REASON than the obvious one. It
# cannot affect a PR verdict: this diffs base .pot against merge .pot, and a
# dictionary edit changes no STRING, so added_messages is empty and the run
# reports nothing whatever was added (measured -- a dictionary-only PR triggers
# the job and correctly finds nothing). It only moves the WHOLE-TREE audit's
# answer. It stays covered because '**' is right for the rest of the directory.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/text-changes-analyzer.yml'
      - 'lang/update_pot.sh'
      - 'lang/extract_json_strings.py'
      - 'lang/unicode_check.py'
      - 'lang/string_extractor/**'
      - 'tools/pot_diff.py'
      - 'tools/spell_check.py'
      - 'tools/spell_check_pr.py'
      - 'tools/spell_check_unit_test.py'
      - 'tools/spell_checker/**'
      - 'src/*.h'
      - 'src/*.cpp'
      - 'data/**/*.json'

concurrency:
  group: text-changes-analyzer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-text-changes:
    runs-on: cdda-ci

    # Generous against a measured cost of well under a minute: update_pot.sh is
    # ~3 s and runs twice on a pull request, once on a dispatch, and the depth-2
    # checkout moves 136 MB rather than the repository's full 12 GB. The bound
    # exists to cap a hang, not to describe the work.
    timeout-minutes: 20

    steps:
    # ONE checkout, where upstream had three: merge commit, base commit, merge
    # commit again, recovering the two SHAs by regex-matching GitHub's synthetic
    # merge commit MESSAGE ("Merge <head> into <base>"). Both halves avoidable --
    # a synthetic merge commit HAS the two commits as parents, so HEAD^1 and
    # HEAD^2 give the same answer without parsing English prose only GitHub
    # promises to write.
    #
    # fetch-depth: 2 makes one checkout enough and is nearly free: measured here,
    # depth 1 is 139 MB / 28 s and depth 2 is 136 MB / 23 s -- the second commit
    # is a delta, not a copy. Full history is 12 GB. Depth 2 on a merge commit
    # carries BOTH parents with usable trees; verified on a purpose-built
    # merge-ref fixture, since depth-counting across a merge is easy to get wrong.
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 2
        persist-credentials: false

    # FIRST, deliberately, doing two jobs.
    #
    # It guards the one pinned dependency NOT pinned for its verdict: regex drives
    # the tokenizer, and these are 33 cases asserting it still splits text the way
    # dictionary.txt was curated against. The cases live in
    # tools/spell_checker/__init__.py; this script is a six-line wrapper.
    #
    # And importing spell_checker loads pyspellchecker and reads the dictionary,
    # making this the cheapest check that the job is on an image that has them.
    # After the .pot generations it would cost two full extractions before
    # reporting a missing module; here a runner on a stale cdda-ci tag fails in
    # seconds and names the cause. Not hypothetical -- the config.yaml image line
    # has been missed on every rebuild so far (11.5a item 1).
    - name: run the spell checker's tokenizer tests
      run: python3 ./tools/spell_check_unit_test.py

    # Resolve what to compare against, and REFUSE to guess.
    #
    # Specific failure guarded: if the forge hands us the PR HEAD instead of a
    # merge commit, HEAD^2 does not exist, and the naive fallback -- treat it as a
    # whole-tree scan -- reports all 1,833 pre-existing findings as though the PR
    # caused them. Worse than not running. So the base comes from the merge
    # commit, or from the event payload, or the job FAILS.
    #
    # workflow_dispatch has no PR to diff against, and leaving it undefined would
    # make the Run button a no-op that looks like a pass. It is the whole-tree
    # audit instead: compare against an empty .pot, reporting every unrecognized
    # string. That is the on-demand form of the measurement the warn-only decision
    # rests on, and how you would work the backlog down.
    - name: resolve comparison base
      id: base
      # Both values arrive through the ENVIRONMENT, not pasted in by ${{ }}.
      # Interpolation happens BEFORE the shell sees the line, so a payload field
      # holding shell metacharacters would be executed, not compared -- the
      # standard Actions script-injection shape. Neither field is a live risk here
      # (a SHA is a poor vehicle, EVENT_NAME is a fixed vocabulary); it is written
      # this way because the mixed form invites an unsafe field inline later.
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -eu
        if [ "${EVENT_NAME:-}" = "workflow_dispatch" ]; then
          echo "mode=whole-tree" >> "$GITHUB_OUTPUT"
          echo "Dispatch run: auditing the whole tree, not a diff."
          exit 0
        fi

        # HEAD^1 is the base and HEAD^2 the incoming head -- ON GITHUB. That is a
        # CONVENTION of how the forge builds its synthetic merge commit, not a
        # property of git, and this has never run against a real Forgejo PR (wave
        # C). Backwards would not error: the diff is just computed the wrong way
        # round, and since spell_check_pr.py only reads diff["added"], a reversed
        # base silently checks the strings the PR REMOVED. A green run that
        # checked the wrong side is the shape this file is otherwise careful about.
        #
        # So it is cross-checked from data already local at depth 2. If the
        # payload names a base SHA equal to HEAD^2, this forge reverses parent
        # order and HEAD^2 is used. If the payload is absent or names neither
        # parent (the base branch moved on since the merge was computed), HEAD^1
        # stands -- the documented order and the safe default.
        if git rev-parse --verify -q HEAD^2 >/dev/null 2>&1; then
          p1=$( git rev-parse HEAD^1 )
          p2=$( git rev-parse HEAD^2 )
          base="$p1"
          note="HEAD^1 (conventional parent order)"

          if [ -n "${PR_BASE_SHA:-}" ] && [ "$PR_BASE_SHA" = "$p2" ]; then
            base="$p2"
            note="HEAD^2 -- this forge reverses parent order, per the event payload"
          fi

          echo "mode=diff" >> "$GITHUB_OUTPUT"
          echo "base_ref=$base" >> "$GITHUB_OUTPUT"
          echo "HEAD is a merge commit; base is $note = $base"
          exit 0
        fi

        # Not a merge commit. Fall back to the payload, which needs an extra
        # shallow fetch since depth 2 did not reach it. That fetch runs AFTER
        # persist-credentials: false stripped the token, so on a private repo it
        # can fail on AUTH rather than on a bad SHA -- one of the things
        # "unfetchable" below covers. The primary path never needs it.
        base="${PR_BASE_SHA:-}"
        if [ -n "$base" ] && git fetch --depth 1 origin "$base" >/dev/null 2>&1; then
          echo "mode=diff" >> "$GITHUB_OUTPUT"
          echo "base_ref=$base" >> "$GITHUB_OUTPUT"
          echo "HEAD is not a merge commit; base taken from the event payload = $base"
          exit 0
        fi

        echo "Could not determine a base commit to diff against." >&2
        echo "HEAD ($( git rev-parse HEAD )) has no second parent, and" >&2
        echo "github.event.pull_request.base.sha was empty or unfetchable." >&2
        echo "Failing rather than falling back to a whole-tree scan, which would" >&2
        echo "report the tree's pre-existing findings as though this PR caused them." >&2
        exit 1

    # Linked worktree rather than checking the base out over the workspace.
    # update_pot.sh writes three UNTRACKED files into lang/po/ (gui.pot, json.pot,
    # cataclysm-dda.pot -- none tracked, despite upstream's defensive `rm -f`),
    # and switching branches under them is avoidable state. Worktrees work in a
    # shallow clone.
    - name: generate translation template on the base commit
      if: steps.base.outputs.mode == 'diff'
      # Same reasoning as PR_BASE_SHA above: this value can originate in the
      # event payload, so it reaches the shell as data.
      env:
        BASE_REF: ${{ steps.base.outputs.base_ref }}
      run: |
        set -eu
        git worktree add -q "$RUNNER_TEMP/basewt" "$BASE_REF"
        cd "$RUNNER_TEMP/basewt"

        # Attribute a failure HERE to the base, explicitly. This step runs code the
        # PR did not write, so a bare traceback naming a data file and line reads
        # exactly like the PR broke something. LIVE TRIGGER: `master` carries a
        # real missing comma in data/json/items/tool/electronics.json (verified
        # 2026-08-23, python json fails at line 176) -- CDDA's own reader tolerates
        # it, so it is invisible to the game and to json_formatter. A PR that FIXES
        # such a file still fails here, because the base is generated first.
        if ! ./lang/update_pot.sh; then
          echo "" >&2
          echo "The above failure is in the BASE commit ($BASE_REF), not in this" >&2
          echo "pull request. The base tree cannot produce a .pot, so there is" >&2
          echo "nothing to diff against and this check cannot run." >&2
          echo "" >&2
          echo "A missing comma in a data/ JSON file is the usual cause: CDDA's" >&2
          echo "own reader accepts it, so neither the game nor json_formatter" >&2
          echo "complains, but lang/extract_json_strings.py uses Python's json," >&2
          echo "which does not. Fix it on the base branch." >&2
          exit 1
        fi

        cp lang/po/cataclysm-dda.pot "$RUNNER_TEMP/base.pot"

    - name: generate translation template on this commit
      run: |
        set -eu
        ./lang/update_pot.sh
        cp lang/po/cataclysm-dda.pot "$RUNNER_TEMP/merge.pot"

    # An empty .pot carrying only the header, so pot_diff reports every string in
    # the tree as new. polib is the only thing that knows how to write a header
    # this file's own reader will accept, which is why this is python and not a
    # heredoc.
    - name: build an empty base for the whole-tree audit
      if: steps.base.outputs.mode == 'whole-tree'
      run: |
        set -eu
        python3 - <<'PY'
        import os
        import polib
        merged = polib.pofile(os.path.join(os.environ["RUNNER_TEMP"], "merge.pot"))
        empty = polib.POFile()
        empty.metadata = merged.metadata
        empty.save(os.path.join(os.environ["RUNNER_TEMP"], "base.pot"))
        PY

    # WARN ONLY -- green no matter what this finds. A measured decision.
    #
    # The whole-tree audit reports 1,833 strings, and sampling the top finds
    # essentially no typos: Exodii NPC dialect (kennit, yarkin, this'n), Xedra
    # Evolved and MindOverMatter invented vocabulary (stormwrought, shadowstuff),
    # nether lore (quadraphract), deliberately mis-spelled children's notes, and
    # the FN Five-seveN, an actual product name. All correct by design. Failing on
    # non-empty output would gate PRs on content that is right, hardest on
    # dialogue and mods -- the files this fork edits most.
    #
    # Upstream did not fail either: it uploaded the output for
    # post-spell-check-result.yml to post as a PR comment, which says in its own
    # words "you can simply disregard if this is inaccurate". Same advisory,
    # delivered to the log, since the artifact relay and its consumer are both
    # dropped (2.4).
    #
    # THE EXIT STATUS CANNOT DISTINGUISH "found nothing" FROM "found something".
    # spell_check_pr.py exits 0 either way -- measured: a seeded three-word typo
    # produced 1,650 bytes of findings at rc 0. Upstream knew, which is why it
    # measured output LENGTH. EMPTINESS decides whether there are findings, so any
    # future move to blocking must key on that, not on `set -e`. The status is
    # still checked, for the one thing it CAN tell you: whether the checker ran.
    - name: spell check the changed text
      env:
        MODE: ${{ steps.base.outputs.mode }}
      run: |
        set -eu
        out="$RUNNER_TEMP/spell_check_output"

        # pot_diff runs TWICE, as upstream ran it. -j SUPPRESSES the
        # human-readable listing rather than adding to it, so one call puts the
        # changed strings in the log and the other feeds the checker. NOT a
        # duplicated line.
        #
        # The listing is gated on diff mode: in the whole-tree audit the base is
        # an EMPTY .pot, so "added" is every message in the game -- 18 MB /
        # 221,187 lines against 301 KB of actual findings. Sixty times the log to
        # say "everything is new". On a real PR it is exactly the context wanted.
        if [ "${MODE:-}" = "diff" ]; then
          python3 ./tools/pot_diff.py "$RUNNER_TEMP/base.pot" "$RUNNER_TEMP/merge.pot"
        else
          echo "Whole-tree audit: skipping the added-message listing, which here" \
               "would be every string in the game. Findings follow."
        fi

        python3 ./tools/pot_diff.py "$RUNNER_TEMP/base.pot" "$RUNNER_TEMP/merge.pot" \
            -j "$RUNNER_TEMP/pot_diff.json"

        # WARN-ONLY APPLIES TO FINDINGS, NOT TO FAILURES. The status is captured,
        # not discarded, because these are three outcomes and one is not "clean":
        #
        #   rc 0, empty output       -- checked, found nothing
        #   rc 0, non-empty output   -- checked, found something: advisory
        #   rc non-zero              -- DID NOT CHECK
        #
        # DO NOT END THIS LINE WITH `|| true`. Measured with a seeded crash in
        # spell_check_pr.py: traceback printed, no output file, and the job
        # reported "No unrecognized words in the changed text" and went green -- a
        # clean bill of health from a check that never ran. That is the shape
        # 11.6 item 7 forbids, so a non-zero status fails the job; findings do not.
        status=0
        python3 ./tools/spell_check_pr.py -i "$RUNNER_TEMP/pot_diff.json" > "$out" || status=$?

        if [ "$status" -ne 0 ]; then
          echo "The spell checker exited $status, so the text was NOT checked." >&2
          echo "Its error is above. This fails the job; a finding would not." >&2
          exit 1
        fi

        if [ -s "$out" ]; then
          echo "----- spell checker output -----"
          cat "$out"
          echo "--------------------------------"
          echo "Advisory only; this job does not fail on the above." \
               "Add genuinely correct words to tools/spell_checker/dictionary.txt."
        else
          echo "No unrecognized words in the changed text."
        fi
