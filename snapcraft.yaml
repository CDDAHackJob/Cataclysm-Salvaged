name: cataclysm-salvaged
version: git
summary: Apocalyptic turn-based survival game
icon: data/xdg/io.github.CDDAHackJob.Cataclysm-Salvaged.svg
architectures:
  - build-on: [amd64]
    run-on: [amd64]
description: |
  Cataclysm: Salvaged is a turn-based survival game set in an apocalyptic world. Surviving is difficult as you are thrown, ill-equipped, into a landscape now riddled with monstrosities. Flesh eating zombies are neither the strangest nor the deadliest you will encounter here.

  Cataclysm: Salvaged is a modified version of Cataclysm: Dark Days Ahead.

  Note: This snap installs the ncurses version of the game. Start playing by running the command `cataclysm-salvaged` on your favorite terminal after installation.

  License: CC-BY-SA 3.0 unported
grade: devel
confinement: strict
apps:
  cataclysm-salvaged:
    command: cataclysm-launcher
    environment:
      LD_LIBRARY_PATH: $LD_LIBRARY_PATH:$SNAP/usr/lib/x86_64-linux-gnu/

parts:
  cataclysm:
    plugin: make
    build-packages: [astyle, ccache, build-essential, libncurses5-dev, libncursesw5-dev, gettext]
    override-build: make NATIVE=linux64 RELEASE=1 LTO=1 LOCALIZE=1 CCACHE=1 USE_HOME_DIR=1 && mv * $SNAPCRAFT_PART_INSTALL
    stage: [data, cataclysm, cataclysm-launcher, usr]
    prime: [data, cataclysm, cataclysm-launcher, usr]
